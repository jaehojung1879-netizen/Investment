name: Prospective ops

# Unattended recorder + monitor for approved PROSPECTIVE research ledgers (prospective-ops-v1).
# No LLM, no AI session, no token spend: plain Python on the registered, pinned code.
#
# SAFE BY DEFAULT. `corporate-writer` writes only when scripts/prospective_ops.py guard says ALLOW_WRITE, which needs the
# owner-committed registry flag AND the single-writer attestation (every legacy Claude trigger attested DISABLED). Until then
# the scheduled run is a no-op for that job and `monitor` only reads. The registered code, spec and authorization are never
# edited here: the writer runs the exact pinned commit in its own worktree.
#
# Window: a KR session's receipt is created after the 18:00 KST final close and before the next open. 10:40 UTC = 19:40 KST;
# the later runs (11:40, 13:00, 14:20 UTC) retry the SAME session only. live_run speaks for the KST DATE of the run and only after 09:00 UTC,
# so it can write only between 09:00 and 15:00 UTC on a session day; a run delayed past 15:00 UTC writes nothing and the session stays missed.
# A missed session stays missed: nothing here back-fills or re-dates.

on:
  schedule:
    - cron: "40 10 * * 1-5"
    - cron: "40 11 * * 1-5"
    - cron: "0 13 * * 1-5"
    - cron: "20 14 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "status-only (monitor, never writes a receipt) or write (guarded writer, then monitor)"
        type: choice
        options: [status-only, write]
        default: status-only

permissions:
  contents: write

concurrency:
  group: prospective-ops
  cancel-in-progress: false

jobs:
  corporate-writer:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      session: ${{ steps.run.outputs.session }}
      status: ${{ steps.run.outputs.status }}
    steps:
      - name: Checkout main (operations code)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install operations dependencies
        run: pip install -r requirements.txt

      - name: Fetch signal-history
        run: git fetch origin signal-history

      - name: Guard (fail closed)
        id: guard
        run: |
          set +e
          python scripts/prospective_ops.py guard --study kr-corporate-information-events-v1 --ledger-ref origin/signal-history | tee guard.json
          code=${PIPESTATUS[0]}
          if [ "$code" = "0" ]; then echo "allowed=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "2" ]; then echo "allowed=false" >> "$GITHUB_OUTPUT"
          else echo "::error::guard crashed with exit $code"; exit "$code"; fi
          echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat guard.json >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Registered LIVE run on the pinned commit
        id: run
        if: steps.guard.outputs.allowed == 'true' && (github.event_name == 'schedule' || inputs.mode == 'write')
        env:
          DART_API_KEY: ${{ secrets.DART }}
        run: |
          set -euo pipefail
          PINNED=$(python -c "import json;print([s for s in json.load(open('research/prospective_ops/registry.json'))['studies'] if s['studyId']=='kr-corporate-information-events-v1'][0]['automation']['pinnedCodeCommit'])")
          git worktree add --detach "$RUNNER_TEMP/pinned" "$PINNED"
          pip install -r "$RUNNER_TEMP/pinned/requirements.txt"
          git config user.name "corporate-event-receipt-bot"
          git config user.email "actions@github.com"
          cd "$RUNNER_TEMP/pinned"
          python -m research.corporate_event_readiness_v1.cohort.live_run --workdir "$RUNNER_TEMP/work" | tee "$RUNNER_TEMP/live_run.json"
          LAST=$(tail -n 1 "$RUNNER_TEMP/live_run.json")
          echo "status=$(echo "$LAST" | python -c "import json,sys;print(json.load(sys.stdin)['status'])")" >> "$GITHUB_OUTPUT"
          echo "session=$(echo "$LAST" | python -c "import json,sys;print(json.load(sys.stdin).get('signalDate',''))")" >> "$GITHUB_OUTPUT"

      - name: Verify the receipt is on the remote ledger (a green job is not a receipt)
        if: steps.run.outputs.status == 'RECORDED' || steps.run.outputs.status == 'ALREADY_RECORDED'
        run: |
          git fetch origin signal-history
          python scripts/prospective_ops.py verify-receipt --study kr-corporate-information-events-v1 \
            --session "${{ steps.run.outputs.session }}" --ledger-ref origin/signal-history

  monitor:
    needs: corporate-writer
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build operations status (read-only over receipts)
        id: status
        run: |
          set +e
          git fetch origin signal-history
          OUTCOME='{"kr-corporate-information-events-v1": "${{ needs.corporate-writer.result }}"}'
          python scripts/prospective_ops.py status --ledger-ref origin/signal-history \
            --as-of "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --writer-outcomes "$OUTCOME" --out prospective-status.json > /dev/null
          echo "alert_exit=$?" >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("prospective-status.json"))
          print("| study | state | scheduled | valid | missed | last record | reason |\n|---|---|---|---|---|---|---|")
          for s in d["studies"]:
              print(f"| {s['studyId']} | {s['operatingState']} | {s['scheduledRecords']} | {s['validRecords']} | {s['missedRecords']} | {s['lastRecordSession']} | {s['failureReason']} |")
          print("\nAlerts (enabled studies only):", d["alerts"] or "none")
          PY

      - name: Verify what must not change has not changed (baseline receipts, registered hashes, pinned tree)
        run: python scripts/prospective_ops.py verify-immutability --study kr-corporate-information-events-v1 --ledger-ref origin/signal-history

      - uses: actions/upload-artifact@v4
        with:
          name: prospective-status
          path: prospective-status.json

      - name: Publish status snapshot to signal-history (overwritten snapshot, never a receipt)
        run: |
          git config user.name "prospective-ops-bot"
          git config user.email "actions@github.com"
          git worktree add ledger-work origin/signal-history
          cd ledger-work && git checkout -B signal-history
          mkdir -p ledger/research-ops
          cp ../prospective-status.json ledger/research-ops/prospective-status.json
          git add ledger/research-ops/prospective-status.json
          if git diff --cached --quiet; then echo "status unchanged"; exit 0; fi
          git commit -m "ledger: prospective ops status"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:signal-history; then exit 0; fi
            git fetch origin signal-history
            git rebase origin/signal-history || { git rebase --abort; echo "::error::rebase failed"; exit 1; }
            sleep $((attempt * 3))
          done
          echo "::error::status publish failed after 5 attempts"; exit 1

      - name: Fail the run when an enabled study owes an alert
        if: steps.status.outputs.alert_exit != '0'
        run: |
          echo "::error::an enabled prospective study is MISSED / EXECUTION_FAILED / SOURCE_BLOCKED; see the job summary"
          exit 1
