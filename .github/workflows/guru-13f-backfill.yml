name: Guru 13F historical backfill

# DATA FOUNDATION for a future, separate research line (the "Guru Decision
# Atlas") — never wired into Main Alpha scoring
# (pipeline/longterm.py, pipeline/opportunity.py, pipeline/kelly_portfolio.py,
# pipeline/build.py), which tests/test_guru_alpha_separation.py enforces
# mechanically, not by convention.
#
# `workflow_dispatch` only for now, deliberately not on a schedule yet —
# mirroring `fundamental-acceleration-seal.yml`'s own reasoning: this
# workflow's network wiring has never been exercised against GitHub Actions'
# real egress. AGENTS.md's Vendor refusal invariants (v2.9) and this repo's
# own `scripts/probe_sec_bulk_datasets.py` already measured `www.sec.gov`
# refusing a bulk DERA ZIP from Actions on 2026-09-04, on the same host the
# Form 13F bulk dataset and the per-manager submissions API both live on —
# strong prior evidence this whole track is blocked today, but a probe run
# is what actually decides it, not that prior measurement by itself.
#
# The probe runs FIRST, every time, and the backfill job only starts when the
# probe reports SERVED. A human triggers this after reviewing the probe's
# output artifact; nothing here runs unattended.
#
# THIS DOES NOT COMMIT TO GIT. The backfill's output (the new store shards
# under data/research/guru-decision-atlas/ plus its manifest and report) is
# uploaded as a build artifact only. A first run against real SEC data,
# writing directly into git history with no human review of the result, is
# exactly the kind of unverified-write this workflow's own workflow_dispatch
# -only gate exists to prevent — committing the artifact is a follow-up PR,
# not a step here, until this has run cleanly at least once.

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Backfill start date (YYYY-MM-DD)"
        type: string
        default: "2013-01-01"
      bulk_url:
        description: "SEC bulk Form 13F dataset ZIP to try first (blank = skip straight to the per-manager EDGAR route)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: guru-13f-backfill
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      verdict: ${{ steps.probe.outputs.verdict }}
      route: ${{ steps.probe.outputs.route }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Probe Guru 13F access
        id: probe
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.bulk_url }}" ]; then
            python scripts/probe_guru_13f_access.py --output probe-output.json \
              --bulk-url "${{ inputs.bulk_url }}" | tee probe.log
          else
            python scripts/probe_guru_13f_access.py --output probe-output.json | tee probe.log
          fi
          verdict=$(python -c "import json; print(json.load(open('probe-output.json'))['verdict'])")
          route=$(python -c "import json; print(json.load(open('probe-output.json'))['recommendedRoute'])")
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "route=$route" >> "$GITHUB_OUTPUT"

      - name: Upload the probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guru-13f-access-probe
          path: |
            probe-output.json
            probe.log
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo '## Guru 13F access probe'
            echo
            echo '```'
            tail -n 60 probe.log 2>/dev/null || echo 'no probe output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  backfill:
    needs: probe
    if: needs.probe.outputs.verdict == 'SERVED'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test the store, identity and separation modules before touching the network
        run: >-
          python -m pytest -q
          tests/test_guru_13f_store.py
          tests/test_security_identity.py
          tests/test_guru_alpha_separation.py
          tests/test_backfill_guru_13f.py

      - name: Backfill
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          set -o pipefail
          args=(--start-date "${{ inputs.start_date }}" --output guru-13f-backfill-report.json)
          if [ -n "${{ inputs.bulk_url }}" ] && [ "${{ needs.probe.outputs.route }}" = "BULK_DATASET" ]; then
            args+=(--bulk-url "${{ inputs.bulk_url }}")
          fi
          python scripts/backfill_guru_13f.py "${args[@]}" | tee backfill.log

      - name: Manifest summary
        if: always()
        run: |
          python -c "
          import json
          from pathlib import Path
          p = Path('data/research/guru-decision-atlas/manifest.json')
          print(json.dumps(json.loads(p.read_text()), indent=2) if p.exists() else 'no manifest written')
          "

      - name: Upload the store increment and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guru-13f-backfill-output
          path: |
            data/research/guru-decision-atlas/
            guru-13f-backfill-report.json
            backfill.log
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo '## Guru 13F backfill'
            echo
            echo '```'
            tail -n 80 backfill.log 2>/dev/null || echo 'no backfill output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
