name: KR Alpha Atlas Phase C input amendment (manual only)
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'validate/preflight are outcome-free; execute requires exact owner-committed v2 approval'
        type: choice
        options: [validate, preflight, execute]
        default: validate
permissions:
  contents: read
  actions: read
concurrency:
  group: kr-alpha-atlas-phase-c-v1-single-attempt
  cancel-in-progress: false
jobs:
  study:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions:
      contents: write
      actions: read
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - run: python -m pip install -r requirements-kr-alpha-atlas-phase-c.txt
      - name: Retrieve exact source commits without a lock
        run: |
          git fetch --no-tags --depth=1 origin fb6e83743fd8cdba647d1522a4645b662a9d5647
          git fetch --no-tags --depth=1 --filter=blob:none origin 4ea107ed0cde289f0a049a65ff13d2441a786710
      - run: python scripts/run_kr_alpha_atlas_phase_c_amended.py validate
      - run: python -m pytest -q tests/test_kr_alpha_atlas_phase_c.py tests/test_kr_alpha_atlas_phase_c_amendment.py
      - name: Full outcome-free corrected preflight
        if: inputs.action == 'preflight'
        run: python scripts/run_kr_alpha_atlas_phase_c_amended.py preflight --expected-main "$GITHUB_SHA" --work /tmp/atlas-phase-c-amended-audit
      - name: The same global study, exactly one owner-authorized execution
        if: inputs.action == 'execute'
        run: python scripts/run_kr_alpha_atlas_phase_c_amended.py execute --work /tmp/atlas-phase-c-amended
      - name: Durable attempt and exact-byte results in the shared study namespace
        if: always() && inputs.action == 'execute'
        uses: actions/upload-artifact@v4
        with:
          name: kr-alpha-atlas-phase-c-v1-results-${{ github.run_id }}
          path: /tmp/atlas-phase-c-amended/results/
          if-no-files-found: ignore
          retention-days: 90
      - name: Outcome-free audit receipt
        if: always() && inputs.action == 'preflight'
        uses: actions/upload-artifact@v4
        with:
          name: kr-alpha-atlas-phase-c-v2-preflight-${{ github.run_id }}
          path: /tmp/atlas-phase-c-amended-audit/corrected-preflight.json
          if-no-files-found: ignore
          retention-days: 90
