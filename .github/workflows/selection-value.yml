name: Selection-value decomposition

# Read-only research diagnostic. It consumes the same pinned replay-v16 ledger
# the benchmark-alpha analysis does and writes only job artifacts in the code
# checkout — never inside the sealed ledger.
#
# It answers two questions the published reports could not. Of the gap to the
# matched benchmark, how much belongs to the SCREEN and how much to the RANKING;
# and does the CHALLENGER's ranking clear its own permutation null. The sealed
# report permutes the champion's conviction score, so its verdict has never been
# evidence about the selector a promotion would actually move.
#
# The challenger null dominates the runtime: 200 draws x 2 modes x 155 blocks of
# real `selection_and_baseline` calls, on top of pricing the full fixed
# cross-section. Budgeted like the replay rather than like the unit suite.
on:
  workflow_dispatch:
  push:
    branches: [research/selection-value-decomposition-v1]
    paths:
      - 'pipeline/selection_value.py'
      - 'pipeline/benchmark_alpha.py'
      - 'pipeline/kelly_portfolio.py'
      - 'pipeline/portfolio_validation.py'
      - 'pipeline/selection_null.py'
      - 'scripts/run_selection_value_replay.py'
      - 'tests/test_selection_value.py'
      - '.github/workflows/selection-value.yml'
      - 'docs/results/selection-value-*'

permissions:
  contents: read

concurrency:
  group: selection-value-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selection-value:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout research code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test the decomposition and the null's selector stamp
        run: >-
          python -m pytest -q
          tests/test_selection_value.py
          tests/test_selection_null.py
          tests/test_portfolio_validation.py
          tests/test_evidence_contract.py

      - name: Check out pinned sealed inputs (read-only)
        uses: actions/checkout@v5
        with:
          ref: b71d8cb5ce21815980d28b606852f9294d43cc53
          path: replay-work
          persist-credentials: false

      - name: Run the selection-value ladder and the challenger null
        run: |
          set -o pipefail
          python -u scripts/run_selection_value_replay.py replay-work/ledger \
            --output selection-value-report.json \
            --markdown selection-value-report.md \
            | tee selection-value.log

      - name: Verify sealed checkout unchanged
        run: test -z "$(git -C replay-work status --porcelain)"

      - name: Verify checked-in deterministic result when present
        run: |
          if test -f docs/results/selection-value-report.json; then
            cmp selection-value-report.json docs/results/selection-value-report.json
            cmp selection-value-report.md docs/results/selection-value-report.md
          fi

      - name: Upload analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selection-value-decomposition-v1
          path: |
            selection-value-report.json
            selection-value-report.md
            selection-value.log
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          if test -f selection-value-report.md; then
            cat selection-value-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            tail -n 100 selection-value.log >> "$GITHUB_STEP_SUMMARY"
          fi
