name: KR integrated alpha portfolio v1
# EXPLORATORY_DEVELOPMENT_ON_OUTCOME_EXPOSED_KR_HISTORY: the design integrates three sealed, outcome-exposed component studies (market risk model,
# industry anatomy, stock within-industry anatomy), so every historical number this study can produce is DEVELOPMENT evidence, never validation.
# Pull requests run synthetic tests plus outcome-free `verify` and `readiness` (identities, calendar, committed files, a synthetic six-path world) and
# nothing else. `execute` exists only as a manual workflow_dispatch on merged main. It never reruns any sealed prior study, never invokes another
# workflow and never contacts a data vendor: it reads the immutable bytes already committed plus the exact preserved raw-input artifact.
# ONE-SHOT: after identities and the registered signal-time gates pass (and before any market value is read or portfolio valued) the run creates
# refs/tags/kr-integrated-alpha-portfolio-v1-execution-lock and ...-execution-lock-<specSha256> with atomic POST /git/refs. Tags are never moved or
# deleted; ANY ref under the prefix refuses execution. A failure after the lock consumes the study permanently: DO NOT RETRY. A failure before it spends nothing.
# SEAL: when `execute` succeeds, the `seal` job verifies the run, the artifact digest and file list, manifest, marker, spec and both lock refs, copies the
# exact bytes plus a provenance record to research/kr-integrated-alpha-portfolio-v1-result-seal-<runId> and opens ONE Draft pull request. It never reruns
# an outcome, never rewrites a result byte, never merges and never marks the PR ready. `mode: seal` re-attempts ONLY the seal for an earlier execution run.
# SEAL HANDOFF: if the exact-byte seal branch is pushed but GITHUB_TOKEN is refused permission to create the Draft PR (the kr-market-risk-model-v1 precedent),
# the failure is classified RECOVERABLE_SEAL_HANDOFF_FAILURE (exit 3, job summary with the manual steps). The branch stays immutable, the execution is never
# rerun, no credential or permission is changed here, and a human opens the Draft PR by hand from the pushed branch.
on:
  pull_request:
    paths:
      - 'pipeline/kr_integrated_alpha_portfolio*'
      - 'scripts/run_kr_integrated_alpha_portfolio_v1.py'
      - 'scripts/seal_kr_integrated_alpha_portfolio_v1.py'
      - 'scripts/build_kr_integrated_alpha_portfolio_v1_spec.py'
      - 'research_specs/kr-integrated-alpha-portfolio-v1*'
      - 'tests/test_kr_integrated_alpha_portfolio_v1*'
      - 'docs/kr-integrated-alpha-portfolio-v1-design.md'
      - 'docs/results/kr-integrated-alpha-portfolio-v1-*'
      - '.github/workflows/kr-integrated-alpha-portfolio-v1.yml'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [verify, execute, seal]
        default: verify
      inputArtifact:
        description: Exact preserved raw-input artifact name (required for execute)
        type: string
        required: false
      inputRunId:
        description: Producing workflow run ID of the exact raw snapshot (required for execute)
        type: string
        required: false
      executionRunId:
        description: For mode=seal only, the run id of the earlier successful execute run whose artifact is sealed (nothing is executed)
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: kr-integrated-alpha-portfolio-v1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frozen-machine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Synthetic tests and outcome-free identity and readiness (dates only)
        run: |
          ruff check .
          python -m pytest -q tests/test_kr_integrated_alpha_portfolio_v1.py tests/test_kr_integrated_alpha_portfolio_v1_replay.py tests/test_kr_integrated_alpha_portfolio_v1_lifecycle.py tests/test_kr_integrated_alpha_portfolio_v1_result_seal.py
          python scripts/run_kr_integrated_alpha_portfolio_v1.py --mode verify --output run
          python scripts/run_kr_integrated_alpha_portfolio_v1.py --mode readiness --output run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kr-integrated-alpha-portfolio-v1-verify-${{ github.run_id }}
          path: run
          retention-days: 30
  execute:
    # Never on pull_request. Requires an explicit manual dispatch with mode=execute.
    name: execute
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'execute'
    needs: frozen-machine
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write      # ONLY to create the one-shot lock tags (git refs); nothing is pushed by this job
      actions: read
    env:
      PORTFOLIO_INPUT_ARTIFACT: ${{ inputs.inputArtifact }}
      PORTFOLIO_INPUT_RUN_ID: ${{ inputs.inputRunId }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Main-only guard, committed spec, nothing sealed, no lock, no earlier results artifact
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            if (context.ref !== 'refs/heads/main') throw new Error('MAIN_ONLY');
            const main = await github.rest.git.getRef({...context.repo, ref: 'heads/main'});
            if (main.data.object.sha !== context.sha) throw new Error('MAIN_HEAD_CHANGED');
            const specPath = 'research_specs/kr-integrated-alpha-portfolio-v1.json';
            for (const p of [specPath, 'research_specs/kr-integrated-alpha-portfolio-v1.sha256']) {
              const committed = cp.execFileSync('git', ['show', 'HEAD:' + p]);
              if (!committed.equals(fs.readFileSync(p))) throw new Error('SPEC_NOT_COMMITTED_AT_HEAD');
            }
            const spec = JSON.parse(fs.readFileSync(specPath));
            for (const [rel, want] of Object.entries(spec.priors.sealedArtifacts)) {
              const sha = require('crypto').createHash('sha256').update(fs.readFileSync(rel)).digest('hex');
              if (sha !== want) throw new Error('PRIOR_SEALED_ARTIFACT_CHANGED_' + rel);
            }
            const pin = spec.input;
            if (process.env.PORTFOLIO_INPUT_ARTIFACT !== pin.artifactName || process.env.PORTFOLIO_INPUT_RUN_ID !== String(pin.producingRunId)) throw new Error('INPUT_ARTIFACT_IDENTITY_MISMATCH');
            for (const p of [spec.lifecycle.resultPath, spec.lifecycle.markerPath, spec.lifecycle.manifestPath]) {
              if (fs.existsSync(p)) throw new Error('INTEGRATED_PORTFOLIO_ALREADY_SEALED');
            }
            const matching = await github.rest.git.listMatchingRefs({...context.repo, ref: 'tags/' + spec.studyId + '-execution-lock'});
            if (matching.data.length > 0) throw new Error('EXECUTION_LOCK_ALREADY_EXISTS');
            const art = await github.rest.actions.getArtifact({...context.repo, artifact_id: pin.artifactId});
            const a = art.data;
            if (a.expired || a.name !== pin.artifactName || String(a.workflow_run.id) !== String(pin.producingRunId) || a.digest !== 'sha256:' + pin.artifactArchiveSha256) throw new Error('PRESERVED_ARTIFACT_IDENTITY_MISMATCH');
            const earlier = await github.paginate(github.rest.actions.listArtifactsForRepo, {...context.repo, per_page: 100});
            if (earlier.some(x => !x.expired && x.name.startsWith('kr-integrated-alpha-portfolio-v1-results-'))) throw new Error('RESULTS_ARTIFACT_ALREADY_EXISTS');
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Download the exact preserved raw snapshot
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.inputArtifact }}
          path: inputs
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.inputRunId }}
      - name: Development execution (pins and signal-time gates before the lock, lock before the marker, marker before any market value or portfolio)
        id: execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/run_kr_integrated_alpha_portfolio_v1.py --mode execute --inputs inputs --output run
      - uses: actions/upload-artifact@v4
        if: always() && steps.execution.outcome == 'success'
        with:
          name: kr-integrated-alpha-portfolio-v1-results-${{ github.run_id }}
          path: run
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always() && steps.execution.outcome != 'success'
        with:
          name: kr-integrated-alpha-portfolio-v1-attempt-${{ github.run_id }}
          path: run
          retention-days: 90
          if-no-files-found: ignore
      - name: Report a consumed failed attempt (no retry)
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const matching = await github.rest.git.listMatchingRefs({...context.repo, ref: 'tags/kr-integrated-alpha-portfolio-v1-execution-lock'});
            const consumed = matching.data.length > 0;
            await core.summary.addHeading(consumed ? 'STUDY CONSUMED: the lock exists and the execution failed after it. DO NOT RETRY.'
                                                   : 'Stopped before the lock: nothing was spent.').write();
  seal:
    name: seal
    needs: [frozen-machine, execute]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && needs.frozen-machine.result == 'success' &&
      ((inputs.mode == 'execute' && needs.execute.result == 'success') || inputs.mode == 'seal')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # push the seal branch only
      pull-requests: write   # open ONE Draft pull request; nothing is merged
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.mode == 'seal' && inputs.executionRunId || github.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Execution run identity and the exact formal results artifact (never an attempt artifact)
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "MAIN_ONLY"; exit 1; }
          case "$RUN_ID" in ''|*[!0-9]*) echo "EXECUTION_RUN_ID_REQUIRED"; exit 1;; esac
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/$1"; }
          api "actions/runs/${RUN_ID}" > run.json
          api "actions/runs/${RUN_ID}/jobs?per_page=100" > jobs.json
          api "actions/runs/${RUN_ID}/artifacts?per_page=100" > artifacts.json
          python - <<'PY'
          import json, os
          run = json.load(open("run.json"))
          if run.get("path") != ".github/workflows/kr-integrated-alpha-portfolio-v1.yml":
              raise SystemExit("NOT_THIS_WORKFLOW")
          name = "kr-integrated-alpha-portfolio-v1-results-" + os.environ["RUN_ID"]
          hits = [a for a in json.load(open("artifacts.json"))["artifacts"] if a["name"] == name]
          if len(hits) != 1:
              raise SystemExit("FORMAL_RESULTS_ARTIFACT_NOT_FOUND")
          json.dump(hits[0], open("artifact-metadata.json", "w"))
          open(os.environ["GITHUB_ENV"], "a").write("EXEC_SHA=" + run["head_sha"] + "\nARTIFACT_ID=" + str(hits[0]["id"]) + "\n")
          PY
      - name: Base the seal on the execution commit; nothing sealed yet; seal branch absent
        run: |
          set -euo pipefail
          git checkout -q --detach "$EXEC_SHA"
          [ "$(git rev-parse HEAD)" = "$EXEC_SHA" ] || { echo "NOT_ON_THE_EXECUTION_COMMIT"; exit 1; }
          python scripts/seal_kr_integrated_alpha_portfolio_v1.py check-main --root .
          git fetch -q origin main
          if git cat-file -e origin/main:docs/results/kr-integrated-alpha-portfolio-v1-result.json 2>/dev/null; then echo "ALREADY_SEALED_ON_MAIN"; exit 1; fi
          SEAL_BRANCH="research/kr-integrated-alpha-portfolio-v1-result-seal-${RUN_ID}"
          if git ls-remote --exit-code --heads origin "$SEAL_BRANCH" >/dev/null 2>&1; then echo "SEAL_BRANCH_EXISTS"; exit 1; fi
          echo "SEAL_BRANCH=$SEAL_BRANCH" >> "$GITHUB_ENV"
      - name: Download the exact archive (its digest is verified before anything is extracted)
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" -o artifact.zip
      - name: Verify every identity, copy exact bytes, write provenance (no outcome is recomputed)
        run: |
          set -euo pipefail
          python scripts/seal_kr_integrated_alpha_portfolio_v1.py seal --root . --run-id "$RUN_ID" --main-sha "$EXEC_SHA" --run run.json --jobs jobs.json \
            --metadata artifact-metadata.json --archive artifact.zip --sealed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Commit and push the immutable seal branch (nothing is merged here)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$SEAL_BRANCH"
          git add docs/results/kr-integrated-alpha-portfolio-v1-result.json docs/results/kr-integrated-alpha-portfolio-v1-execution-started.json \
            docs/results/kr-integrated-alpha-portfolio-v1-manifest.json docs/results/kr-integrated-alpha-portfolio-v1-seal-provenance.json
          git commit -q -m "Research: seal kr-integrated-alpha-portfolio-v1 development result (exact artifact bytes, provenance; nothing recomputed)"
          git push origin "$SEAL_BRANCH"
          [ "$(git ls-remote origin "refs/heads/$SEAL_BRANCH" | cut -f1)" = "$(git rev-parse HEAD)" ] || { echo "SEAL_BRANCH_NOT_AT_THE_SEALED_COMMIT"; exit 1; }
      - name: Open ONE Draft pull request (a refusal here is a RECOVERABLE SEAL-HANDOFF failure, never an execution failure)
        run: |
          set -uo pipefail
          python scripts/seal_kr_integrated_alpha_portfolio_v1.py open-pr --root . --head "$SEAL_BRANCH"
          rc=$?
          if [ "$rc" = "3" ]; then
            echo "::error title=RECOVERABLE SEAL-HANDOFF FAILURE::The formal execution SUCCEEDED and the exact-byte seal is on the pushed branch $SEAL_BRANCH. Only the Draft PR API call was refused. DO NOT RERUN THE EXECUTION. A human opens the Draft PR by hand (see the job summary)."
            exit 1
          fi
          exit "$rc"
