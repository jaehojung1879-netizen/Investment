name: Alpha reliability

# Read-only research CHALLENGER. It consumes the same pinned replay-v16 ledger
# the benchmark-alpha, selection-value, switch-hurdle and signal-persistence
# analyses do, and writes only job artifacts in the code checkout — never
# inside the sealed ledger.
#
# Four studies on this ledger point at one place: the conversion from a
# continuous alpha signal into a discrete five-name book. This measures that
# conversion — what separates the last name held from the first excluded, what
# separates the two sides of every swap, and whether the arriving name went on
# to beat the one it displaced — and then runs a one-axis-per-rung ladder that
# spends the SAME signal more carefully: persistence (k=6, inherited from
# signal-persistence-v1), then a confidence contraction, then an
# uncertainty-aware incumbent/challenger comparison.
#
# No factor is added, no factor weight moves, and no transaction cost enters
# the ladder. The cost-hurdle stack moves two axes and is reported outside it.
on:
  workflow_dispatch:
  push:
    branches: [research/alpha-reliability-v1]
    paths:
      - 'pipeline/alpha_reliability.py'
      - 'pipeline/signal_persistence.py'
      - 'pipeline/switch_hurdle.py'
      - 'pipeline/benchmark_alpha.py'
      - 'pipeline/kelly_portfolio.py'
      - 'pipeline/portfolio_validation.py'
      - 'pipeline/selection_value.py'
      - 'scripts/run_alpha_reliability_replay.py'
      - 'tests/test_alpha_reliability.py'
      - '.github/workflows/alpha-reliability.yml'
      - 'docs/results/alpha-reliability-*'

permissions:
  contents: read

concurrency:
  group: alpha-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alpha-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout research code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test the contraction guarantee and the backward-only inputs
        run: >-
          python -m pytest -q
          tests/test_alpha_reliability.py
          tests/test_signal_persistence.py
          tests/test_switch_hurdle.py
          tests/test_selection_value.py
          tests/test_portfolio_validation.py

      - name: Check out pinned sealed inputs (read-only)
        uses: actions/checkout@v5
        with:
          ref: b71d8cb5ce21815980d28b606852f9294d43cc53
          path: replay-work
          persist-credentials: false

      - name: Run the boundary diagnostics and the reliability ladder
        run: |
          set -o pipefail
          python -u scripts/run_alpha_reliability_replay.py replay-work/ledger \
            --output alpha-reliability-report.json \
            --markdown alpha-reliability-report.md \
            | tee alpha-reliability.log

      - name: Verify sealed checkout unchanged
        run: test -z "$(git -C replay-work status --porcelain)"

      - name: Verify checked-in deterministic result when present
        run: |
          if test -f docs/results/alpha-reliability-report.json; then
            cmp alpha-reliability-report.json docs/results/alpha-reliability-report.json
            cmp alpha-reliability-report.md docs/results/alpha-reliability-report.md
          fi

      - name: Upload analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-reliability-v1
          path: |
            alpha-reliability-report.json
            alpha-reliability-report.md
            alpha-reliability.log
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          if test -f alpha-reliability-report.md; then
            cat alpha-reliability-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            tail -n 100 alpha-reliability.log >> "$GITHUB_STEP_SUMMARY"
          fi
