name: Regional rotation analysis

# Read-only research validation. Pin the ledger revision as well as v1 rules.
# Branch pushes validate before opening the Draft PR; no schedule or ledger writes.
on:
  workflow_dispatch:
  push:
    branches: [research/regional-rotation-validation-v1]
    paths:
      - 'pipeline/regional*.py'
      - 'scripts/run_regional_rotation_replay.py'
      - '.github/workflows/regional-rotation.yml'
      - 'tests/test_regional*.py'

permissions:
  contents: read

concurrency:
  group: regional-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regional-rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout research code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test validation semantics
        run: python -m pytest -q tests/test_regional_validation.py tests/test_regional_rotation.py tests/test_run_regional_rotation_replay_cli.py

      - name: Check out pinned sealed inputs (read-only)
        uses: actions/checkout@v5
        with:
          ref: b71d8cb5ce21815980d28b606852f9294d43cc53
          path: replay-work
          persist-credentials: false

      - name: Run the regional rotation analysis
        run: |
          set -o pipefail
          python -u scripts/run_regional_rotation_replay.py replay-work/ledger \
            --output regional-rotation-report.json \
            --markdown regional-rotation-report.md \
            --paths-output regional-standalone-paths.json.gz \
            | tee regional-rotation.log

      - name: Verify sealed checkout unchanged
        run: test -z "$(git -C replay-work status --porcelain)"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regional-rotation-validation-v1
          path: |
            regional-rotation-report.json
            regional-rotation-report.md
            regional-standalone-paths.json.gz
            regional-rotation.log
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          if test -f regional-rotation-report.md; then
            cat regional-rotation-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            tail -n 80 regional-rotation.log >> "$GITHUB_STEP_SUMMARY"
          fi
