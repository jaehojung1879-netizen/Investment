name: Signal persistence

# Read-only research diagnostic. It consumes the same pinned replay-v16 ledger
# the benchmark-alpha analysis does and writes only job artifacts in the code
# checkout — never inside the sealed ledger.
#
# `regional-switch-hurdle-v1` gained eight times more from holding names longer
# than from the fees it saved, which is a statement about the SIGNAL rather than
# about costs. This asks it directly, two ways: a parameter-free diagnostic
# comparing what a rebalance ADDED against what it RETAINED, and a one-axis
# ladder that ranks on the alpha percentile averaged over the span the alpha
# forecasts (k = 1 control, 3, 6 blocks; 126 sessions / 21 = 6).
#
# The smoothing-plus-hurdle path moves TWO axes and is reported outside the
# ladder, because a number produced by moving two things is attributable to
# neither.
on:
  workflow_dispatch:
  push:
    branches: [research/signal-persistence-v1]
    paths:
      - 'pipeline/signal_persistence.py'
      - 'pipeline/switch_hurdle.py'
      - 'pipeline/benchmark_alpha.py'
      - 'pipeline/kelly_portfolio.py'
      - 'pipeline/portfolio_validation.py'
      - 'pipeline/selection_value.py'
      - 'scripts/run_signal_persistence_replay.py'
      - 'tests/test_signal_persistence.py'
      - '.github/workflows/signal-persistence.yml'
      - 'docs/results/signal-persistence-*'

permissions:
  contents: read

concurrency:
  group: signal-persistence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signal-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout research code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test the smoother's direction and the paired diagnostic
        run: >-
          python -m pytest -q
          tests/test_signal_persistence.py
          tests/test_switch_hurdle.py
          tests/test_selection_value.py
          tests/test_portfolio_validation.py

      - name: Check out pinned sealed inputs (read-only)
        uses: actions/checkout@v5
        with:
          ref: b71d8cb5ce21815980d28b606852f9294d43cc53
          path: replay-work
          persist-credentials: false

      - name: Run the persistence diagnostic and the smoothing ladder
        run: |
          set -o pipefail
          python -u scripts/run_signal_persistence_replay.py replay-work/ledger \
            --output signal-persistence-report.json \
            --markdown signal-persistence-report.md \
            | tee signal-persistence.log

      - name: Verify sealed checkout unchanged
        run: test -z "$(git -C replay-work status --porcelain)"

      - name: Verify checked-in deterministic result when present
        run: |
          if test -f docs/results/signal-persistence-report.json; then
            cmp signal-persistence-report.json docs/results/signal-persistence-report.json
            cmp signal-persistence-report.md docs/results/signal-persistence-report.md
          fi

      - name: Upload analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-persistence-v1
          path: |
            signal-persistence-report.json
            signal-persistence-report.md
            signal-persistence.log
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          if test -f signal-persistence-report.md; then
            cat signal-persistence-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            tail -n 100 signal-persistence.log >> "$GITHUB_STEP_SUMMARY"
          fi
