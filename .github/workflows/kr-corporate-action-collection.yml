name: Collect KR terminated-security corporate actions

# `auto` (the default) mirrors `dart-ownership-events.yml`'s own gate: a
# schema/access probe runs first, and collection proceeds automatically only
# if that probe reports `SERVED`. If DART refuses the key on `list.json`, or
# an expected field goes missing, the run stops there and is never reported
# as a successful collection.
#
# This collects only `list.json`'s CONFIRMED disclosure-index rows for the
# 22 KR terminated securities `alpha-opportunity-model-v3`'s survivorship
# audit found without dividend or terminal-value lineage — see
# `pipeline/kr_corporate_action_events.py` and
# `docs/kr-terminated-security-total-return-foundation-v1.md`. It is a
# reading list for a human reviewer, never a resolved terminal-action book:
# nothing this workflow writes assigns a termination type to any security.
#
# `max_calls` IS AN API-CALL BUDGET, NOT A TICKER COUNT. A single issuer's
# `list.json` history can span more than one page, so "22 tickers" and "22
# calls" are different quantities once pagination is in play. The default
# is a conservative estimate, not a promise that every run finishes every
# ticker — `collect_kr_corporate_actions.py`'s own printed summary states
# whether the run completed the full work list, and re-running the same
# inputs resumes from wherever it stopped.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto=확인 후 자동 수집 / probe=확인만 / collect=확인 없이 강제 수집"
        type: choice
        options: ["auto", "probe", "collect"]
        default: "auto"
      max_calls:
        description: "collect 전용 — list.json 호출 상한 (종목 수가 아님: 발행사 1곳이 여러 페이지를 쓸 수 있음). 기본값은 22개 종목을 대개 끝낼 수 있도록 보수적으로 잡은 값이며, 완료를 보장하지 않음 — 실행 결과의 tickersRemaining/datasetComplete를 확인할 것. 종목이 남으면 같은 입력으로 재실행하면 이어서 진행됨."
        type: string
        default: "250"
      max_minutes:
        description: "collect 전용 — 최대 분"
        type: string
        default: "30"
      max_calls_dividends:
        description: "collect-dividends 전용 — alotMatter.json 호출 상한 (1호출=1종목x1년). 22개 종목 + 연속상장 대조표본까지 포함한 보수적 기본값이며, 완료를 보장하지 않음 — datasetComplete를 확인할 것."
        type: string
        default: "700"
      max_minutes_dividends:
        description: "collect-dividends 전용 — 최대 분"
        type: string
        default: "45"

permissions:
  contents: write

concurrency:
  group: signal-history-kr-corporate-actions
  cancel-in-progress: false

jobs:
  probe:
    if: inputs.mode == 'probe' || inputs.mode == 'auto'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      verdict: ${{ steps.run.outputs.verdict }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Probe list.json and alotMatter.json
        id: run
        env:
          DART_API_KEY: ${{ secrets.DART }}
        run: |
          python scripts/probe_kr_corporate_actions.py \
            --output kr-corporate-actions-probe.json | tee probe.log

      - name: Upload the probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kr-corporate-actions-probe
          path: |
            kr-corporate-actions-probe.json
            probe.log
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo '## KR corporate-action disclosure probe'
            echo
            echo '```'
            tail -n 120 probe.log 2>/dev/null || echo 'no probe output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  collect:
    needs: [probe]
    if: |
      always() &&
      (inputs.mode == 'collect' ||
       (inputs.mode == 'auto' && needs.probe.outputs.verdict == 'SERVED'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check out signal-history branch (orphan-safe)
        run: |
          git config user.name "kr-corporate-actions-bot"
          git config user.email "actions@github.com"
          mkdir -p kr-actions-work
          if git ls-remote --exit-code --heads origin signal-history; then
            git fetch origin signal-history
            git worktree add kr-actions-work origin/signal-history
            git -C kr-actions-work checkout -B signal-history
          else
            git worktree add --detach kr-actions-work
            git -C kr-actions-work checkout --orphan signal-history
            git -C kr-actions-work rm -rf . || true
          fi
          mkdir -p kr-actions-work/ledger/kr-corporate-actions

      - name: Collect the disclosure index
        env:
          DART_API_KEY: ${{ secrets.DART }}
        run: |
          python scripts/collect_kr_corporate_actions.py \
            kr-actions-work/ledger/kr-corporate-actions \
            --inventory docs/results/kr-termination-inventory.json \
            --max-calls "${{ inputs.max_calls || '250' }}" \
            --max-minutes "${{ inputs.max_minutes || '30' }}" \
            | tee collect.log

      - name: Commit & push to signal-history
        run: |
          cd kr-actions-work
          git add ledger/kr-corporate-actions
          if git diff --cached --quiet; then
            echo "no new disclosures"
            exit 0
          fi
          git commit -m "kr-corporate-actions: disclosure-index slice for $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            if git push origin signal-history; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the remote"
            git fetch origin signal-history
            if ! git rebase origin/signal-history; then
              git rebase --abort || true
              echo "could not rebase onto signal-history"
              exit 1
            fi
          done
          echo "push failed after 5 attempts"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo '## KR corporate-action disclosure collection'
            echo
            echo '```'
            tail -n 60 collect.log 2>/dev/null || echo 'no collection output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  collect-dividends:
    needs: [probe, collect]
    if: |
      always() &&
      (inputs.mode == 'collect' ||
       (inputs.mode == 'auto' && needs.probe.outputs.verdict == 'SERVED'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Runs AFTER `collect` (via `needs`) so both jobs never push to
      # `signal-history` concurrently, and re-fetches it fresh rather than
      # reusing `collect`'s own worktree (a separate job, separate runner).
      - name: Check out signal-history branch (orphan-safe)
        run: |
          git config user.name "kr-corporate-actions-bot"
          git config user.email "actions@github.com"
          mkdir -p kr-actions-work
          if git ls-remote --exit-code --heads origin signal-history; then
            git fetch origin signal-history
            git worktree add kr-actions-work origin/signal-history
            git -C kr-actions-work checkout -B signal-history
          else
            git worktree add --detach kr-actions-work
            git -C kr-actions-work checkout --orphan signal-history
            git -C kr-actions-work rm -rf . || true
          fi
          mkdir -p kr-actions-work/ledger/kr-corporate-actions

      # `alotMatter.json` -- the dividend-section endpoint the probe job
      # above promotes from CANDIDATE_UNCONFIRMED. The continuing-name
      # cross-validation sample is drawn from THIS checkout's own
      # `ledger/universe/kr` shards (see `kr_continuing_dividend_sample.py`)
      # -- never a second hand-picked list.
      - name: Collect dividend sections
        env:
          DART_API_KEY: ${{ secrets.DART }}
        run: |
          python scripts/collect_kr_dividend_sections.py \
            kr-actions-work/ledger/kr-corporate-actions \
            --inventory docs/results/kr-termination-inventory.json \
            --universe-root kr-actions-work/ledger/universe/kr \
            --max-calls "${{ inputs.max_calls_dividends || '700' }}" \
            --max-minutes "${{ inputs.max_minutes_dividends || '45' }}" \
            | tee collect-dividends.log

      - name: Commit & push to signal-history
        run: |
          cd kr-actions-work
          git add ledger/kr-corporate-actions
          if git diff --cached --quiet; then
            echo "no new dividend rows"
            exit 0
          fi
          git commit -m "kr-corporate-actions: dividend-section slice for $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            if git push origin signal-history; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the remote"
            git fetch origin signal-history
            if ! git rebase origin/signal-history; then
              git rebase --abort || true
              echo "could not rebase onto signal-history"
              exit 1
            fi
          done
          echo "push failed after 5 attempts"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo '## KR corporate-action dividend-section collection'
            echo
            echo '```'
            tail -n 60 collect-dividends.log 2>/dev/null || echo 'no collection output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  gate-stopped:
    needs: [probe]
    if: inputs.mode == 'auto' && needs.probe.outputs.verdict != 'SERVED'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain why collection did not run
        run: |
          {
            echo '## KR corporate actions — collection skipped'
            echo
            echo "probe verdict: \`${{ needs.probe.outputs.verdict }}\` (not \`SERVED\`)"
            echo
            echo 'Collection only runs automatically after a `SERVED` probe.'
            echo 'Check the probe job'"'"'s summary above for what refused it.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "probe verdict was ${{ needs.probe.outputs.verdict }}, not SERVED — collection skipped" >&2
          exit 1
