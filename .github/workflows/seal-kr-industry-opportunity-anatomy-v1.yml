name: Seal KR industry opportunity anatomy v1 result
# TEMPORARY. Runs on the seal PR only. Downloads the exact formal result artifact INSIDE Actions, verifies its archive SHA-256
# before anything is extracted, then commits the exact bytes to the seal branch. It recomputes no statistic, never executes the
# study and is deleted before the seal PR is finished so no reusable sealing path remains.
on:
  pull_request:
    paths:
      - '.github/seal/seal_kr_industry_opportunity_anatomy_v1.py'
      - '.github/workflows/seal-kr-industry-opportunity-anatomy-v1.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: seal-kr-industry-opportunity-anatomy-v1
  cancel-in-progress: false
jobs:
  seal:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/seal-kr-industry-opportunity-anatomy-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_ID: '11295658265'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - name: Guards (nothing sealed yet, committed spec is the frozen spec)
        run: |
          set -euo pipefail
          python .github/seal/seal_kr_industry_opportunity_anatomy_v1.py check-main --root .
      - name: Artifact metadata must match exactly
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" -o artifact-metadata.json
          python .github/seal/seal_kr_industry_opportunity_anatomy_v1.py check-metadata --metadata artifact-metadata.json
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/kr-industry-opportunity-anatomy-v1-execution-lock" -o lock-refs.json
      - name: Download the exact archive and verify its SHA-256 before extracting
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" -o artifact.zip
          [ "$(sha256sum artifact.zip | awk '{print $1}')" = "ee336dc4ff51cbef21f3f8adbb780c5987e93525d677cdc7bdb5a7dd5400f4ba" ] || { echo ARCHIVE_SHA256_MISMATCH; exit 1; }
      - name: Extract, verify manifest provenance, commit the exact bytes
        run: |
          set -euo pipefail
          python .github/seal/seal_kr_industry_opportunity_anatomy_v1.py seal --archive artifact.zip --workdir "$RUNNER_TEMP/extracted" \
            --root . --sealed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --lock-refs lock-refs.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/results/kr-industry-opportunity-anatomy-v1-result.json docs/results/kr-industry-opportunity-anatomy-v1-manifest.json \
            docs/results/kr-industry-opportunity-anatomy-v1-execution-started.json docs/results/kr-industry-opportunity-anatomy-v1-seal-provenance.json \
            data/kr-industry-opportunity-anatomy-v1
          git commit -q -m "Data: exact bytes of the formal kr-industry-opportunity-anatomy-v1 result artifact (no statistic recomputed)"
          git push origin "HEAD:${{ github.head_ref }}"
