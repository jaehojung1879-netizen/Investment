name: Regional switch hurdle

# Read-only research diagnostic. It consumes the same pinned replay-v16 ledger
# the benchmark-alpha analysis does and writes only job artifacts in the code
# checkout — never inside the sealed ledger.
#
# It tests the one lever `selection_value` left open: replace an incumbent only
# when the improvement covers what the swap costs, priced in the region where it
# is actually paid, because a Korean round trip costs 1.6x to 2.5x an American
# one.
#
# The ladder carries its own NO-HURDLE CONTROL. This loop is not
# `portfolio_replay` — it builds its calibration on gross rather than
# cost-adjusted excess — so a rung compared against the published path would be
# credited with a scoring change it did not make. Every rung is paired against
# the control instead, and the control's gap to the published path is reported
# as a harness difference.
on:
  workflow_dispatch:
  push:
    branches: [research/regional-switch-hurdle-v1]
    paths:
      - 'pipeline/switch_hurdle.py'
      - 'pipeline/benchmark_alpha.py'
      - 'pipeline/kelly_portfolio.py'
      - 'pipeline/portfolio_validation.py'
      - 'pipeline/selection_value.py'
      - 'scripts/run_switch_hurdle_replay.py'
      - 'tests/test_switch_hurdle.py'
      - '.github/workflows/switch-hurdle.yml'
      - 'docs/results/switch-hurdle-*'

permissions:
  contents: read

concurrency:
  group: switch-hurdle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  switch-hurdle:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout research code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test the hurdle, its control and the cost schedule
        run: >-
          python -m pytest -q
          tests/test_switch_hurdle.py
          tests/test_selection_value.py
          tests/test_benchmark_alpha.py
          tests/test_portfolio_validation.py

      - name: Check out pinned sealed inputs (read-only)
        uses: actions/checkout@v5
        with:
          ref: b71d8cb5ce21815980d28b606852f9294d43cc53
          path: replay-work
          persist-credentials: false

      - name: Run the switch-hurdle ladder against its control
        run: |
          set -o pipefail
          python -u scripts/run_switch_hurdle_replay.py replay-work/ledger \
            --output switch-hurdle-report.json \
            --markdown switch-hurdle-report.md \
            | tee switch-hurdle.log

      - name: Verify sealed checkout unchanged
        run: test -z "$(git -C replay-work status --porcelain)"

      - name: Verify checked-in deterministic result when present
        run: |
          if test -f docs/results/switch-hurdle-report.json; then
            cmp switch-hurdle-report.json docs/results/switch-hurdle-report.json
            cmp switch-hurdle-report.md docs/results/switch-hurdle-report.md
          fi

      - name: Upload analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: switch-hurdle-decomposition-v1
          path: |
            switch-hurdle-report.json
            switch-hurdle-report.md
            switch-hurdle.log
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          if test -f switch-hurdle-report.md; then
            cat switch-hurdle-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            tail -n 100 switch-hurdle.log >> "$GITHUB_STEP_SUMMARY"
          fi
