name: Probe KRX point-in-time index membership

# `dataIntegrity` reports KR membershipCoveragePct 0.0: build_universe_history
# deliberately writes no Korean rows, because KRX-DELISTING is "every delisted
# KRX name" rather than "was an index member", and the one attempt to fill the
# gap invented a Korean cross-section that read as 100% covered. What would
# close it is a DATED KOSPI 200 constituent list, which KRX's own data portal
# claims to serve.
#
# The probe's job is not to confirm that a date returns 200 names — an endpoint
# that ignores its date parameter does that too, and its answer is today's list
# with a date stamped on it. It is to check the dates DISAGREE.
#
# A yes does not open the integrity gate and is not proposed as if it does. The
# 2026-08-30 delisting measurement already showed only 34.55% of departed KOSPI
# names can be priced at all, so perfect membership takes KR unvouched from
# 100% to about 40% and stops, while `universe_ready` asks for 100.0. What it
# would buy is a COUNTED gap of named companies in place of an unknown one.
#
# On demand, like the other probes: nothing downstream consumes this, and a
# probe the daily jobs depend on is a probe that breaks them.

on:
  workflow_dispatch:
    inputs:
      dates:
        description: "확인할 날짜 (쉼표 구분) — 리플레이 시작(2013) 부터 현재까지"
        type: string
        default: "2013-01-02,2016-01-04,2020-01-02,2024-01-02,2026-09-01"
      index_series:
        description: "지수 계열 (KOSPI=1, KOSDAQ=2)"
        type: string
        default: "1"
      index_code:
        description: "지수 코드 (KOSPI 200=028)"
        type: string
        default: "028"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Probe
        run: |
          set -euo pipefail
          python scripts/probe_krx_index_membership.py \
            --output krx-probe.json \
            --dates "${{ inputs.dates }}" \
            --index-series "${{ inputs.index_series }}" \
            --index-code "${{ inputs.index_code }}" | tee probe.log

      - name: Upload the probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-index-membership-probe
          path: |
            krx-probe.json
            probe.log
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo '## KRX 시점별 지수구성종목 프로브 (한국)'
            echo
            echo '```'
            tail -n 80 probe.log 2>/dev/null || echo '프로브 출력 없음'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
