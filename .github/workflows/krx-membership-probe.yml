name: Probe KRX point-in-time index membership

# `dataIntegrity` reports KR membershipCoveragePct 0.0: build_universe_history
# deliberately writes no Korean rows, because KRX-DELISTING is "every delisted
# KRX name" rather than "was an index member", and the one attempt to fill the
# gap invented a Korean cross-section that read as 100% covered.
#
# The public portal route is dead and measured: `getJsonData.cmd` answered HTTP
# 400 `LOGOUT` on every date, first with no cookies and then with a real portal
# session (JSESSIONID and __smVisitorID both set). This uses the Open API and
# the KRX_API_KEY secret instead.
#
# Two things it is looking for, in order of what they would buy:
#   1. dated index membership — the literal thing that would close the gap;
#   2. dated per-issue trading data carrying MKTCAP and LIST_SHRS, which may be
#      worth more: the replay's KR universe is ~119 large names rather than the
#      KOSPI 200, so a dated market-cap cross-section rebuilds it by the rule it
#      actually uses, and it lists what TRADED that day, which reaches issues
#      that have since delisted.
#
# The endpoint paths are a hypothesis. This cannot be reached from the dev
# container, so rather than guess one and report its failure as the source's
# answer, it tries a candidate list and reports what each returned.
#
# A yes still does not open the integrity gate: `universe_ready` wants both
# coverages at exactly 100.0 and the 2026-08-30 measurement put delisted-KOSPI
# price coverage at 34.55%. What it buys is a counted gap in place of an
# unknown one.
#
# On demand, like the other probes: nothing downstream consumes this, and a
# probe the daily jobs depend on is a probe that breaks them.

on:
  workflow_dispatch:
    inputs:
      dates:
        description: "확인할 날짜 (쉼표 구분) — 리플레이 시작(2013) 부터 현재까지"
        type: string
        default: "2013-01-02,2016-01-04,2020-01-02,2026-09-01"
      base:
        description: "Open API 서비스 루트 (경로가 틀렸다고 판단되면 바꿔서 재실행)"
        type: string
        default: "https://data-dbg.krx.co.kr/svc/apis"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Probe
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/probe_krx_index_membership.py \
            --output krx-probe.json \
            --dates "${{ inputs.dates }}" \
            --base "${{ inputs.base }}" | tee probe.log

      - name: Upload the probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-index-membership-probe
          path: |
            krx-probe.json
            probe.log
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo '## KRX 시점별 지수구성종목 프로브 (한국)'
            echo
            echo '```'
            tail -n 80 probe.log 2>/dev/null || echo '프로브 출력 없음'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
