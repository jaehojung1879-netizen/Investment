name: Collect fundamentals

# Point-in-time financial statements, one budgeted slice per run per region.
# Two jobs in one entry rather than two entries: they do the same three things
# — fetch a slice, shard it, push to `signal-history` — and the Actions list
# has already been trimmed once for exactly this reason.
#
# They run in parallel and push to disjoint paths under `ledger/fundamentals`,
# which the rebase-and-retry below is there to absorb.
#
# US (finnhub) is the newer half. SEC refuses the Actions address range on all
# four of its hosts, measured across request shape, egress address and traffic
# shape; finnhub is the vendor probe run #2 measured end to end — 2012-13
# filings with `filedDate`, for living AND departed names, and every one of the
# seven production value and quality factors computable from the concepts that
# arrived. `docs/us-pit-fundamentals-source.md` carries the run numbers.
#
# Korean point-in-time financial statements, one budgeted slice per run.
#
# The probe established this is worth doing: receipt dates are present on every
# response, all seven statement accounts the factors need come back, and
# quarterly reports are served. It also established why this cannot be one job —
# a DART call takes ~9.4 seconds, and 120 names x 2015-2025 x 4 reports is
# 5,280 calls, about fourteen hours.
#
# So it runs daily, spends a budget, and resumes. The first backfill takes a few
# unattended days; after that a quarter's new filings are minutes. The schedule
# is 03:40 UTC — after the replay (02:40) so the two are not competing for the
# runner, and long before the next day's Pages build reads anything.

on:
  # The daily run takes `auto` — the statements first, then whatever budget is
  # left on share counts. Nothing here needs a human to pick a mode, which
  # matters because the mobile app cannot pass workflow inputs at all.
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:
    inputs:
      # Empty on purpose, and this is the whole point of them. A non-empty
      # default is sent on every dispatch, so it overrides the per-region
      # ceiling below and quietly makes every hand-started run a small one —
      # and the mobile app cannot pass inputs at all, so there is no way to
      # override the override from a phone. Left empty, both paths fall through
      # to the ceiling each region set for itself, and typing a number here
      # still wins when someone deliberately wants a short run.
      max_calls:
        description: "최대 호출 수 (비우면 지역별 기본 상한)"
        type: string
        default: ""
      max_minutes:
        description: "최대 분 (비우면 지역별 기본 상한)"
        type: string
        default: ""
      # `raw-statements` / `raw-probe-2015` run the SEPARATE `kr-raw` job below
      # (kr-accounting-coverage-repair-v1) and skip both daily collectors. The
      # schedule never sends a target, so the daily run can never take them.
      target:
        description: "KR 전용 — auto=재무제표 후 주식수까지 / statements / shares / raw-statements=PIT 유니버스 원본행 재수집 / raw-probe-2015=2015 분기 가용성 탐침(전 분기, 원본 XBRL 포함) / raw-xbrl-2015=2015 분기 원본 XBRL 수집(CANDIDATE_UNCONFIRMED)"
        type: choice
        options: ["auto", "statements", "shares", "raw-statements", "raw-probe-2015", "raw-xbrl-2015", "wc-originals-68"]
        default: "auto"
      raw_years:
        description: "raw-statements 전용 — 수집 연도 우선순위 (비우면 2015,2016,2024,2025,2023,2017..2022,2026)"
        type: string
        default: ""
      region:
        description: "어느 쪽을 수집할지 (예약 실행은 항상 둘 다). finnhub-bs-probe = 읽기 전용 재무상태표 진단 / total-assets-source-probe = 총자산 출처 가능성 진단(SEC·Finnhub·Massive·FMP, 수집·기록 없음, max_calls=0이면 계획만, 비우면 출처당 최대 20콜)"
        type: choice
        options: ["both", "kr", "us", "finnhub-bs-probe", "total-assets-source-probe"]
        default: "both"
      # total-assets-source-probe only. Neither input is read by any other job.
      probe_sources:
        description: "total-assets-source-probe 전용 — all=SEC+벤더 / sec=SEC만(키 없음) / vendors=Finnhub·Massive·FMP만"
        type: choice
        options: ["all", "sec", "vendors"]
        default: "all"
      sec_contact:
        description: "total-assets-source-probe 전용 — SEC User-Agent에 넣을 소유자의 연락 가능한 이메일 (비우면 SEC 요청을 하지 않음. 임의 값을 만들지 않으며 noreply·예시 주소는 거부)"
        type: string
        default: ""

permissions:
  contents: write

# Its own group, like the other three writers. All push to signal-history on
# disjoint paths and each rebases and retries, so queueing behind one another
# would only mean a waiting run gets cancelled by the next trigger.
concurrency:
  group: signal-history-fundamentals
  cancel-in-progress: false

jobs:
  kr:
    if: github.event_name == 'schedule' || ((inputs.region == 'both' || inputs.region == 'kr') && !startsWith(inputs.target, 'raw-') && inputs.target != 'wc-originals-68')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check out signal-history branch (orphan-safe)
        run: |
          git config user.name "dart-fundamentals-bot"
          git config user.email "actions@github.com"
          mkdir -p fundamentals-work
          if git ls-remote --exit-code --heads origin signal-history; then
            git fetch origin signal-history
            git worktree add fundamentals-work origin/signal-history
            git -C fundamentals-work checkout -B signal-history
          else
            git worktree add --detach fundamentals-work
            git -C fundamentals-work checkout --orphan signal-history
            git -C fundamentals-work rm -rf . || true
          fi
          mkdir -p fundamentals-work/ledger/fundamentals/kr

      - name: Collect a slice
        env:
          DART_API_KEY: ${{ secrets.DART }}
        run: |
          python scripts/collect_dart_fundamentals.py \
            fundamentals-work/ledger/fundamentals/kr \
            --target "${{ inputs.target || 'auto' }}" \
            --max-calls "${{ inputs.max_calls || '1500' }}" \
            --max-minutes "${{ inputs.max_minutes || '240' }}" \
            | tee collect.log

      - name: Commit & push to signal-history
        run: |
          cd fundamentals-work
          git add ledger/fundamentals
          if git diff --cached --quiet; then
            echo "no new filings"
            exit 0
          fi
          git commit -m "fundamentals: DART ${{ inputs.target || 'auto' }} slice for $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            if git push origin signal-history; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the remote"
            git fetch origin signal-history
            if ! git rebase origin/signal-history; then
              git rebase --abort || true
              echo "could not rebase onto signal-history"
              exit 1
            fi
          done
          echo "push failed after 5 attempts"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo '## DART 재무 수집'
            echo
            echo '```'
            tail -n 30 collect.log 2>/dev/null || echo '수집 출력 없음'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  us:
    if: github.event_name == 'schedule' || ((inputs.region == 'both' || inputs.region == 'us') && !startsWith(inputs.target, 'raw-'))
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # The collector is standard-library only, but `historical_store` — which
      # writes the byte-deterministic shards — is shared with the replay.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # WHY THE SCHEDULED BUDGET IS THE WHOLE BACKFILL. A budget is a ceiling,
      # not a target: once the store has caught up the work list is empty and
      # the run ends in seconds, so a large ceiling costs nothing on an ordinary
      # day. What it buys is the days before that. At the 1,500 calls the first
      # two slices used, the remaining 13,580 windows would take nine more
      # nights of someone remembering to press the button; at 1.1s of pacing
      # they are 249 minutes, which fits in one scheduled run.
      #
      # The pacing is what the rate limit cares about (54 calls a minute, under
      # finnhub's 60), and that does not change. What is untested is whether a
      # run this long meets a daily quota the two shorter ones never reached.
      # If it does, the collector stops on the refusal and does NOT mark the
      # window done, so the next night resumes where it stopped and we will
      # have measured where the real cap is. Nothing is lost either way.

      - name: Check out signal-history branch (orphan-safe)
        run: |
          git config user.name "us-fundamentals-bot"
          git config user.email "actions@github.com"
          mkdir -p us-fundamentals-work
          if git ls-remote --exit-code --heads origin signal-history; then
            git fetch origin signal-history
            git worktree add us-fundamentals-work origin/signal-history
            git -C us-fundamentals-work checkout -B signal-history
          else
            git worktree add --detach us-fundamentals-work
            git -C us-fundamentals-work checkout --orphan signal-history
            git -C us-fundamentals-work rm -rf . || true
          fi
          mkdir -p us-fundamentals-work/ledger/fundamentals/us

      - name: Collect a slice
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB }}
        run: |
          python scripts/collect_finnhub_fundamentals.py \
            us-fundamentals-work/ledger/fundamentals/us \
            --max-calls "${{ inputs.max_calls || '16600' }}" \
            --max-minutes "${{ inputs.max_minutes || '300' }}" \
            | tee us-collect.log

      # A US 10-Q states both a three-month and a year-to-date figure, and the
      # vendor flattens one of them into `report.ic`. Which one decides how TTM
      # has to be built, and reading a year-to-date cash flow as a quarterly one
      # inflates free cash flow fourfold with nothing raising an error. So it is
      # measured from the collected values — the median half-over-first and
      # three-quarters-over-first ratio across companies — exactly as the Korean
      # side settled the same question. Exit 2 means the data does not yet
      # decide; that is an honest outcome and not a broken run, so the step
      # records it instead of failing the collection that just succeeded.
      - name: Measure what a 10-Q period means
        id: semantics
        run: |
          set +e
          python scripts/measure_us_period_semantics.py \
            us-fundamentals-work/ledger/fundamentals/us \
            --json us-fundamentals-work/ledger/fundamentals/us/period-semantics.json \
            | tee us-semantics.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit & push to signal-history
        run: |
          cd us-fundamentals-work
          git add ledger/fundamentals
          if git diff --cached --quiet; then
            echo "no new filings"
            exit 0
          fi
          git commit -m "fundamentals: finnhub US slice for $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            if git push origin signal-history; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the remote"
            git fetch origin signal-history
            if ! git rebase origin/signal-history; then
              git rebase --abort || true
              echo "could not rebase onto signal-history"
              exit 1
            fi
          done
          echo "push still rejected after five attempts"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo '## 미국 PIT 재무 수집 (finnhub)'
            echo
            echo '```'
            tail -n 60 us-collect.log 2>/dev/null || echo '수집 출력 없음'
            echo '```'
            echo
            echo '### 10-Q 기간 의미 (누계인가 독립 분기인가)'
            echo
            echo '```'
            cat us-semantics.log 2>/dev/null || echo '측정 출력 없음'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


  # Manual, opt-in original DART XBRL recovery for fixed Stock-KR WC68.
  # This is NOT a scheduled collection and NEVER alters any ledger, model or
  # sealed research. Original ZIP bytes live only in runner temporary storage.
  # The public route requires NO DART secret. Incomplete source recovery is
  # a research result (0..68), not an absent-source verdict or a CI failure.
  kr-wc68-original:
    if: github.event_name == 'workflow_dispatch' && inputs.region == 'kr' && inputs.target == 'wc-originals-68' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout code and pinned Git histories
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pinned source objects
        run: |
          set -euo pipefail
          git fetch origin signal-history
          for sha in 1bf68f59cffa20239977e2cfaa0f35a07d0ec884 b589d658eedd3c47f555df20db86f37792ee3358; do
            git cat-file -e "$sha^{commit}"
          done

      - name: Install research dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Collect and inspect fixed original receipts
        run: |
          set -euo pipefail
          # Exit 3 explicitly means INCOMPLETE SOURCE; never silently turn
          # zero eligible facts into "validated" or "source absent".
          set +e
          python -m research.stock_working_capital_v1.xbrl_recovery \
            --collect --output "$RUNNER_TEMP/wc68-originals"
          collect_exit=$?
          set -e
          if [ "$collect_exit" != 0 ] && [ "$collect_exit" != 3 ]; then
            echo "::error::DART recovery infrastructure failure ($collect_exit)"
            exit "$collect_exit"
          fi
          python - "$RUNNER_TEMP/wc68-originals/manifest.json" <<'PY'
          import json, pathlib, sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert manifest["fixedReceipts"] == 68
          assert manifest["newHistoricalLabelsRead"] == 0
          # Public artifact contains counts/digests only, NEVER XBRL ZIPs.
          output = {
              "evidenceClass": "SOURCE_ONLY_NOT_ADMISSION",
              "requested": manifest["fixedReceipts"],
              "attemptedHttpRequests": manifest["publicRequestsAttempted"],
              "statusCounts": manifest["statusCounts"],
              "originalPackageCount": manifest["statusCounts"].get(
                  "ACQUIRED_UNVERIFIED_ORIGINAL_XBRL_ZIP", 0),
              "historicalOutcomesRead": 0,
              "allReceiptsVerified": False,
              "originalBytesPersisted": False,
              "sourceAdmissionAuthorized": False,
          }
          pathlib.Path("wc68-source-summary.json").write_text(
              json.dumps(output, ensure_ascii=False, indent=2) + "\n")
          print(json.dumps(output, ensure_ascii=False))
          PY
          set +e
          python -m research.stock_working_capital_v1.pit_join --inspect \
            --packages "$RUNNER_TEMP/wc68-originals" \
            --output "$RUNNER_TEMP/wc68-measurement"
          inspect_exit=$?
          set -e
          if [ "$inspect_exit" != 0 ] && [ "$inspect_exit" != 3 ]; then
            echo "::warning::Input-only inspection unavailable (exit $inspect_exit)"
          fi
          # Do not upload the raw directory, including its objects/*.zip.
          if [ -f "$RUNNER_TEMP/wc68-measurement/coverage.json" ]; then
            cp "$RUNNER_TEMP/wc68-measurement/coverage.json" wc68-input-coverage.json
          fi

      - name: Upload source-only diagnostics (NO original ZIP)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wc68-source-only-diagnostics
          path: |
            wc68-source-summary.json
            wc68-input-coverage.json
          retention-days: 14
          if-no-files-found: warn

  # READ-ONLY diagnostic: why do the filings Finnhub first served from 2026-10-07 have no balance sheet? (docs/us-finnhub-balance-sheet-probe-ko.md)
  #
  # Selected only by `region: finnhub-bs-probe`, which none of the collectors above match, so choosing it cannot start a collection, and a
  # schedule never sends a region. It has its own `contents: read` token (the workflow default is `write`), checks out no credentials, and reads
  # the stored US fundamentals from signal-history as reference data it can never write to (no git config, commit or push appears in this job).
  #
  # WHEN THE FINNHUB KEY IS INJECTED is decided by one secret-free step (`gate`), never by an expression on the secret itself. It reads
  # `max_calls` exactly as typed and separates three cases that the old `inputs.max_calls != '0'` test could not:
  #   blank -> the default 12 requests;  0 -> plan only, no key;  1..20 (no leading zero, no space) -> that many requests;
  #   anything else ('00', '012', ' 0', '21', '-1', 'abc') stops the job BEFORE any step that could hold the key.
  # The key reaches exactly one step, `Probe live`, whose `if` needs the gate's `inject == true`, and the gate only says true for a validated
  # live request dispatched on `main`. Every other path (0, or a live request from any other ref) runs `Plan only`, which never receives the key
  # and makes no request. So a branch can exercise and verify this whole decision without the secret ever being referenced by a step that runs.
  # At most 12 requests by default, a hard ceiling of 20 enforced again by the script. Sanitized report and raw bodies are separate artifacts.
  us-finnhub-bs-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.region == 'finnhub-bs-probe' && inputs.target == 'auto'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Read the stored US fundamentals (read-only reference)
        uses: actions/checkout@v5
        with:
          ref: signal-history
          path: signal-history
          sparse-checkout: ledger/fundamentals/us
          fetch-depth: 1
          persist-credentials: false

      # No secret in this step: it reads the input as typed, validates it, and records the decision as outputs.
      - name: Decide the mode (no secret)
        id: gate
        env:
          MAX_CALLS: ${{ inputs.max_calls }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          raw="${MAX_CALLS-}"
          case "$raw" in
            "") calls=12; source=default ;;
            0)  calls=0;  source=explicit ;;
            *)
              if [[ "$raw" =~ ^[1-9][0-9]?$ ]] && [ "$raw" -le 20 ]; then
                calls="$raw"; source=explicit
              else
                echo "::error title=max_calls::allowed: blank (default 12), 0 (plan only), or a whole number 1-20 with no leading zero or space"
                exit 2
              fi ;;
          esac
          mode=plan; inject=false; reason=PLAN_ONLY_REQUESTED
          if [ "$calls" -gt 0 ]; then
            mode=live
            if [ "$EVENT" = "workflow_dispatch" ] && [ "$REF" = "refs/heads/main" ]; then
              inject=true; reason=LIVE_ON_MAIN_DISPATCH
            else
              reason=LIVE_WITHHELD_NOT_MAIN_DISPATCH
            fi
          fi
          {
            echo "mode=$mode"
            echo "calls=$calls"
            echo "source=$source"
            echo "inject=$inject"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          echo "max_calls input : '${raw}' (${source})"
          echo "requested mode  : ${mode}"
          echo "request budget  : ${calls}"
          echo "key injected    : ${inject} (${reason})"

      - name: Plan only (never receives the key, makes no request)
        if: steps.gate.outputs.inject != 'true'
        run: |
          set -euo pipefail
          python scripts/probe_finnhub_balance_sheet.py \
            --store signal-history/ledger/fundamentals/us \
            --store-commit "$(git -C signal-history rev-parse HEAD)" \
            --max-calls 0 --output probe-report.json --raw-out probe-raw.jsonl.gz | tee probe.log

      # The only step in this job that names the secret, and it is skipped unless the gate validated a live request dispatched on main.
      - name: Probe live (the only step that receives the Finnhub key)
        if: steps.gate.outputs.inject == 'true'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB }}
          CALLS: ${{ steps.gate.outputs.calls }}
        run: |
          set -euo pipefail
          if [ -n "${FINNHUB_API_KEY:-}" ]; then echo "FINNHUB key: present (value never printed)"; else echo "FINNHUB key: ABSENT"; fi
          python scripts/probe_finnhub_balance_sheet.py \
            --store signal-history/ledger/fundamentals/us \
            --store-commit "$(git -C signal-history rev-parse HEAD)" \
            --max-calls "$CALLS" --output probe-report.json --raw-out probe-raw.jsonl.gz | tee probe.log

      - name: Upload the sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finnhub-bs-probe-report
          path: |
            probe-report.json
            probe.log
          retention-days: 90
          if-no-files-found: warn

      - name: Upload the raw response bodies (restricted, short retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finnhub-bs-probe-raw-restricted
          path: probe-raw.jsonl.gz
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        if: always()
        env:
          GATE_MODE: ${{ steps.gate.outputs.mode }}
          GATE_CALLS: ${{ steps.gate.outputs.calls }}
          GATE_SOURCE: ${{ steps.gate.outputs.source }}
          GATE_INJECT: ${{ steps.gate.outputs.inject }}
          GATE_REASON: ${{ steps.gate.outputs.reason }}
        run: |
          {
            echo '## Finnhub 재무상태표 진단 (읽기 전용)'
            echo
            echo "- 입력 해석: ${GATE_SOURCE:-입력 거부} / 모드 ${GATE_MODE:-없음} / 요청 한도 ${GATE_CALLS:-없음}"
            echo "- 키 주입: ${GATE_INJECT:-false} (${GATE_REASON:-게이트 이전에 중단})"
            echo
            echo '```'
            tail -n 60 probe.log 2>/dev/null || echo '진단 출력 없음'
            echo '```'
            echo
            echo '원본 응답은 별도 아티팩트(finnhub-bs-probe-raw-restricted, 7일)에만 있고 이 요약에는 값이 없습니다.'
          } >> "$GITHUB_STEP_SUMMARY"

  # READ-ONLY diagnostic: where can quarterly TOTAL ASSETS come from, with an accession and a filing date? (us-total-assets-source-rescue-v1)
  # Finnhub `financials-reported` stopped sending the balance sheet for newly served filings (probe run 38250579358), so this asks four sources
  # the same bounded questions on one fixed sample (docs/us-readiness/us-total-assets-source-sample-v1.json): SEC data.sec.gov / www.sec.gov,
  # Finnhub standardized /stock/financials, Massive /stocks/financials/v1/balance-sheets, FMP /stable/balance-sheet-statement.
  # It writes nothing into any store, schedules nothing, and never reads signal-history. A vendor key is present only in that vendor's own step, and
  # only when the gate step (which holds no secret) has validated a live request dispatched on main. Off main, or with max_calls=0, it only prints the plan.
  us-total-assets-source-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.region == 'total-assets-source-probe' && inputs.target == 'auto'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # No secret in this step. It validates the typed inputs and records the decision; a rejected input stops the job before any step that can hold a key.
      - name: Decide the mode (no secret)
        id: gate
        env:
          MAX_CALLS: ${{ inputs.max_calls }}
          PROBE_SOURCES: ${{ inputs.probe_sources }}
          SEC_CONTACT: ${{ inputs.sec_contact }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          raw="${MAX_CALLS-}"
          case "$raw" in
            "") calls=20; source=default ;;
            0)  calls=0;  source=explicit ;;
            *)
              if [[ "$raw" =~ ^[1-9][0-9]?$ ]] && [ "$raw" -le 20 ]; then
                calls="$raw"; source=explicit
              else
                echo "::error title=max_calls::allowed: blank (default 20 per source), 0 (plan only), or a whole number 1-20 with no leading zero or space"
                exit 2
              fi ;;
          esac
          case "${PROBE_SOURCES-}" in
            all|sec|vendors) ;;
            *) echo "::error title=probe_sources::allowed: all, sec, vendors"; exit 2 ;;
          esac
          want_sec=false; want_vendors=false
          case "$PROBE_SOURCES" in
            all) want_sec=true; want_vendors=true ;;
            sec) want_sec=true ;;
            vendors) want_vendors=true ;;
          esac
          mode=plan; inject=false; reason=PLAN_ONLY_REQUESTED
          if [ "$calls" -gt 0 ]; then
            mode=live
            if [ "$EVENT" = "workflow_dispatch" ] && [ "$REF" = "refs/heads/main" ]; then
              inject=true; reason=LIVE_ON_MAIN_DISPATCH
            else
              reason=LIVE_WITHHELD_NOT_MAIN_DISPATCH
            fi
          fi
          sec_run=false; sec_note=NOT_REQUESTED
          if [ "$want_sec" = true ] && [ "$inject" = true ]; then
            problem="$(python -c "import os; from pipeline import us_total_assets_source as T; print(T.sec_contact_problem(os.environ.get('SEC_CONTACT')) or '')")"
            if [ -z "$problem" ]; then sec_run=true; sec_note=CONTACT_SUPPLIED; else sec_note="$problem"; fi
          fi
          vendors_run=false
          if [ "$want_vendors" = true ] && [ "$inject" = true ]; then vendors_run=true; fi
          {
            echo "mode=$mode"
            echo "calls=$calls"
            echo "source=$source"
            echo "inject=$inject"
            echo "reason=$reason"
            echo "sec_run=$sec_run"
            echo "sec_note=$sec_note"
            echo "vendors_run=$vendors_run"
          } >> "$GITHUB_OUTPUT"
          echo "max_calls input : '${raw}' (${source})"
          echo "requested mode  : ${mode}"
          echo "request budget  : ${calls} per source"
          echo "sources         : ${PROBE_SOURCES}"
          echo "keys injected   : ${inject} (${reason})"
          echo "SEC requests    : ${sec_run} (${sec_note})"
          echo "vendor requests : ${vendors_run}"

      - name: Plan only (holds no key and no contact, makes no request)
        if: steps.gate.outputs.inject != 'true'
        run: |
          set -euo pipefail
          mkdir -p parts
          python scripts/probe_us_total_assets_sources.py --sources sec,finnhub,massive,fmp --max-calls 0 --output parts/plan.json | tee probe.log

      # No secret here either: SEC needs an identifying contact the OWNER typed, and nothing else.
      - name: SEC data.sec.gov and www.sec.gov (owner-supplied contact, no key)
        if: always() && steps.gate.outputs.sec_run == 'true'
        env:
          SEC_CONTACT: ${{ inputs.sec_contact }}
          CALLS: ${{ steps.gate.outputs.calls }}
        run: |
          set -euo pipefail
          mkdir -p parts
          python scripts/probe_us_total_assets_sources.py --sources sec --max-calls "$CALLS" --output parts/sec.json | tee -a probe.log

      - name: Finnhub standardized balance sheet (the only step that receives the Finnhub key)
        if: always() && steps.gate.outputs.vendors_run == 'true'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB }}
          CALLS: ${{ steps.gate.outputs.calls }}
        run: |
          set -euo pipefail
          mkdir -p parts
          if [ -n "${FINNHUB_API_KEY:-}" ]; then echo "FINNHUB key: present (value never printed)"; else echo "FINNHUB key: ABSENT"; fi
          python scripts/probe_us_total_assets_sources.py --sources finnhub --max-calls "$CALLS" --output parts/finnhub.json | tee -a probe.log

      - name: Massive v1 balance sheets (the only step that receives the Massive key)
        if: always() && steps.gate.outputs.vendors_run == 'true'
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE }}
          CALLS: ${{ steps.gate.outputs.calls }}
        run: |
          set -euo pipefail
          mkdir -p parts
          if [ -n "${MASSIVE_API_KEY:-}" ]; then echo "MASSIVE key: present (value never printed)"; else echo "MASSIVE key: ABSENT"; fi
          python scripts/probe_us_total_assets_sources.py --sources massive --max-calls "$CALLS" --output parts/massive.json | tee -a probe.log

      - name: FMP stable balance sheet (the only step that receives the FMP key)
        if: always() && steps.gate.outputs.vendors_run == 'true'
        env:
          FMP_API_KEY: ${{ secrets.FMP }}
          CALLS: ${{ steps.gate.outputs.calls }}
        run: |
          set -euo pipefail
          mkdir -p parts
          if [ -n "${FMP_API_KEY:-}" ]; then echo "FMP key: present (value never printed)"; else echo "FMP key: ABSENT"; fi
          python scripts/probe_us_total_assets_sources.py --sources fmp --max-calls "$CALLS" --output parts/fmp.json | tee -a probe.log

      - name: Merge the per-source reports (no secret, no request)
        if: always() && steps.gate.outputs.inject == 'true'
        run: |
          set -euo pipefail
          if ls parts/*.json >/dev/null 2>&1; then
            python scripts/probe_us_total_assets_sources.py --merge parts/*.json --output total-assets-report.json | tee -a probe.log
          else
            echo "no per-source report was produced"
          fi

      - name: Upload the report (verdicts and request metadata only; no response bodies, no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-total-assets-source-probe-report
          path: |
            total-assets-report.json
            parts/
            probe.log
          retention-days: 90
          if-no-files-found: warn

      - name: Summary
        if: always()
        env:
          GATE_MODE: ${{ steps.gate.outputs.mode }}
          GATE_CALLS: ${{ steps.gate.outputs.calls }}
          GATE_SOURCE: ${{ steps.gate.outputs.source }}
          GATE_INJECT: ${{ steps.gate.outputs.inject }}
          GATE_REASON: ${{ steps.gate.outputs.reason }}
          GATE_SEC: ${{ steps.gate.outputs.sec_note }}
        run: |
          {
            echo '## 총자산 출처 진단 (읽기 전용)'
            echo
            echo "- 입력 해석: ${GATE_SOURCE:-입력 거부} / 모드 ${GATE_MODE:-없음} / 출처당 요청 한도 ${GATE_CALLS:-없음}"
            echo "- 키 주입: ${GATE_INJECT:-false} (${GATE_REASON:-게이트 이전에 중단})"
            echo "- SEC 연락처: ${GATE_SEC:-게이트 이전에 중단}"
            echo
            echo '```'
            tail -n 40 probe.log 2>/dev/null || echo '진단 출력 없음'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # kr-accounting-coverage-repair-v1. Re-collects DART statement responses WHOLE
  # (every row, every attempt's real status) for every ticker ever in a KR
  # top-120 snapshot, into `ledger/fundamentals/kr-raw` -- never into
  # `ledger/fundamentals/kr`, whose 28 blobs are the sealed v4 execution input.
  # Then rebuilds `kr-canonical-v2` from it and audits that CANDIDATE store's
  # feature coverage against the sealed snapshot's own membership, prices
  # (backward tradability only) and denominator. Outcome-free throughout.
  kr-raw:
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.target, 'raw-')
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      SEALED_SIGNAL_HISTORY_COMMIT: 4ea107ed0cde289f0a049a65ff13d2441a786710
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check out signal-history (writable head + sealed commit, read-only)
        run: |
          git config user.name "dart-raw-statements-bot"
          git config user.email "actions@github.com"
          git fetch origin signal-history
          git worktree add raw-work origin/signal-history
          git -C raw-work checkout -B signal-history
          git worktree add --detach sealed-work "$SEALED_SIGNAL_HISTORY_COMMIT"
          test "$(git -C sealed-work rev-parse HEAD)" = "$SEALED_SIGNAL_HISTORY_COMMIT"
          mkdir -p raw-work/ledger/fundamentals/kr-raw

      - name: Probe fiscal-2015 quarterly availability (writes nothing to the store)
        if: inputs.target == 'raw-probe-2015'
        env:
          DART_API_KEY: ${{ secrets.DART }}
        run: |
          set -o pipefail
          python scripts/collect_dart_raw_statements.py raw-work/ledger/fundamentals/kr-raw \
            --universe-dir sealed-work/ledger/universe/kr --mode probe-2015 --dump-entries \
            --probe-tickers 8 --max-calls 200 --probe-output probe-2015.json | tee raw.log

      - name: Collect original fiscal-2015 XBRL filings (CANDIDATE_UNCONFIRMED accounts)
        if: inputs.target == 'raw-xbrl-2015'
        env:
          DART_API_KEY: ${{ secrets.DART }}
        run: |
          set -o pipefail
          python scripts/collect_dart_xbrl_originals.py raw-work/ledger/fundamentals/kr-xbrl-original \
            --universe-dir sealed-work/ledger/universe/kr \
            --max-calls "${{ inputs.max_calls || '1800' }}" \
            --max-minutes "${{ inputs.max_minutes || '290' }}" | tee raw.log

      - name: Merge with any existing canonical-v2 store and audit the candidate's coverage
        if: inputs.target == 'raw-xbrl-2015'
        run: |
          set -o pipefail
          python scripts/merge_kr_candidate_snapshot.py raw-work/ledger/fundamentals/kr-candidate-merged \
            --canonical-dir raw-work/ledger/fundamentals/kr-canonical-v2 \
            --xbrl-dir raw-work/ledger/fundamentals/kr-xbrl-original | tee canonical.log
          python scripts/audit_kr_accounting_coverage.py --input-root sealed-work \
            --kr-fundamentals-dir raw-work/ledger/fundamentals/kr-candidate-merged \
            --absent-json raw-work/ledger/fundamentals/kr-raw/absent.json \
            --output-dir raw-work/ledger/fundamentals/kr-candidate-merged/coverage-audit | tee audit.log

      # The probe's exact answers (every status and message, the filing index,
      # the XBRL package sizes) kept as a reviewable file, not only a log tail.
      - name: Upload fiscal-2015 probe evidence
        if: always() && inputs.target == 'raw-probe-2015'
        uses: actions/upload-artifact@v4
        with:
          name: dart-fiscal-2015-probe
          path: |
            probe-2015.json
            raw.log
          if-no-files-found: warn

      - name: Collect a slice of raw statement rows
        if: inputs.target == 'raw-statements'
        env:
          DART_API_KEY: ${{ secrets.DART }}
        run: |
          set -o pipefail
          python scripts/collect_dart_raw_statements.py raw-work/ledger/fundamentals/kr-raw \
            --universe-dir sealed-work/ledger/universe/kr --mode collect \
            --years "${{ inputs.raw_years || '2015,2016,2024,2025,2023,2017,2018,2019,2020,2021,2022,2026' }}" \
            --max-calls "${{ inputs.max_calls || '1800' }}" \
            --max-minutes "${{ inputs.max_minutes || '290' }}" | tee raw.log

      - name: Rebuild canonical filings and audit the candidate's coverage
        if: inputs.target == 'raw-statements'
        run: |
          set -o pipefail
          python scripts/build_kr_canonical_filings.py raw-work/ledger/fundamentals/kr-raw \
            raw-work/ledger/fundamentals/kr-canonical-v2 \
            --legacy-dir sealed-work/ledger/fundamentals/kr | tee canonical.log
          if [ -d raw-work/ledger/fundamentals/kr-xbrl-original ]; then
            python scripts/merge_kr_candidate_snapshot.py raw-work/ledger/fundamentals/kr-candidate-merged \
              --canonical-dir raw-work/ledger/fundamentals/kr-canonical-v2 \
              --xbrl-dir raw-work/ledger/fundamentals/kr-xbrl-original | tee -a canonical.log
            AUDIT_DIR=raw-work/ledger/fundamentals/kr-candidate-merged
          else
            AUDIT_DIR=raw-work/ledger/fundamentals/kr-canonical-v2
          fi
          python scripts/audit_kr_accounting_coverage.py --input-root sealed-work \
            --kr-fundamentals-dir "$AUDIT_DIR" \
            --absent-json raw-work/ledger/fundamentals/kr-raw/absent.json \
            --output-dir "$AUDIT_DIR/coverage-audit" | tee audit.log

      - name: Commit & push to signal-history
        if: inputs.target == 'raw-statements' || inputs.target == 'raw-xbrl-2015'
        run: |
          cd raw-work
          # `raw-xbrl-2015` alone never creates kr-canonical-v2 (that is
          # raw-statements' own rebuild step) -- a bare `git add` on a path
          # that does not exist at all is a hard git error ("did not match
          # any files"), not a no-op, and would abort the commit before
          # anything real gets pushed. Add only the paths this run actually
          # produced.
          for path in ledger/fundamentals/kr-raw ledger/fundamentals/kr-canonical-v2 \
                      ledger/fundamentals/kr-xbrl-original ledger/fundamentals/kr-candidate-merged; do
            if [ -e "$path" ]; then
              git add "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "no new raw filings"
            exit 0
          fi
          git commit -m "fundamentals: DART raw statement rows (PIT KR universe) $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            if git push origin signal-history; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the remote"
            git fetch origin signal-history
            if ! git rebase origin/signal-history; then
              git rebase --abort || true
              echo "could not rebase onto signal-history"
              exit 1
            fi
          done
          echo "push failed after 5 attempts"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo '## DART 원본 행 재수집 / 2015 분기 탐침'
            echo
            echo '```'
            tail -n 80 raw.log 2>/dev/null || echo '수집 출력 없음'
            echo '```'
            echo
            echo '### 계정 매핑 증거 (IFRS 요소로만 허용된 행)'
            echo '```'
            cat canonical.log 2>/dev/null || echo '재구성 없음'
            echo '```'
            echo
            echo '### 후보 스냅샷 커버리지 게이트 (outcome-free)'
            echo '```'
            cat audit.log 2>/dev/null || echo '감사 없음'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
