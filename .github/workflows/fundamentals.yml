name: Collect fundamentals

# Point-in-time financial statements, one budgeted slice per run per region.
# Two jobs in one entry rather than two entries: they do the same three things
# — fetch a slice, shard it, push to `signal-history` — and the Actions list
# has already been trimmed once for exactly this reason.
#
# They run in parallel and push to disjoint paths under `ledger/fundamentals`,
# which the rebase-and-retry below is there to absorb.
#
# US (finnhub) is the newer half. SEC refuses the Actions address range on all
# four of its hosts, measured across request shape, egress address and traffic
# shape; finnhub is the vendor probe run #2 measured end to end — 2012-13
# filings with `filedDate`, for living AND departed names, and every one of the
# seven production value and quality factors computable from the concepts that
# arrived. `docs/us-pit-fundamentals-source.md` carries the run numbers.
#
# Korean point-in-time financial statements, one budgeted slice per run.
#
# The probe established this is worth doing: receipt dates are present on every
# response, all seven statement accounts the factors need come back, and
# quarterly reports are served. It also established why this cannot be one job —
# a DART call takes ~9.4 seconds, and 120 names x 2015-2025 x 4 reports is
# 5,280 calls, about fourteen hours.
#
# So it runs daily, spends a budget, and resumes. The first backfill takes a few
# unattended days; after that a quarter's new filings are minutes. The schedule
# is 03:40 UTC — after the replay (02:40) so the two are not competing for the
# runner, and long before the next day's Pages build reads anything.

on:
  # The daily run takes `auto` — the statements first, then whatever budget is
  # left on share counts. Nothing here needs a human to pick a mode, which
  # matters because the mobile app cannot pass workflow inputs at all.
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:
    inputs:
      # Empty on purpose, and this is the whole point of them. A non-empty
      # default is sent on every dispatch, so it overrides the per-region
      # ceiling below and quietly makes every hand-started run a small one —
      # and the mobile app cannot pass inputs at all, so there is no way to
      # override the override from a phone. Left empty, both paths fall through
      # to the ceiling each region set for itself, and typing a number here
      # still wins when someone deliberately wants a short run.
      max_calls:
        description: "최대 호출 수 (비우면 지역별 기본 상한)"
        type: string
        default: ""
      max_minutes:
        description: "최대 분 (비우면 지역별 기본 상한)"
        type: string
        default: ""
      # `raw-statements` / `raw-probe-2015` run the SEPARATE `kr-raw` job below
      # (kr-accounting-coverage-repair-v1) and skip both daily collectors. The
      # schedule never sends a target, so the daily run can never take them.
      target:
        description: "KR 전용 — auto=재무제표 후 주식수까지 / statements / shares / raw-statements=PIT 유니버스 원본행 재수집 / raw-probe-2015=2015 분기 가용성 탐침(전 분기, 원본 XBRL 포함) / raw-xbrl-2015=2015 분기 원본 XBRL 수집(CANDIDATE_UNCONFIRMED)"
        type: choice
        options: ["auto", "statements", "shares", "raw-statements", "raw-probe-2015", "raw-xbrl-2015"]
        default: "auto"
      raw_years:
        description: "raw-statements 전용 — 수집 연도 우선순위 (비우면 2015,2016,2024,2025,2023,2017..2022,2026)"
        type: string
        default: ""
      region:
        description: "어느 쪽을 수집할지 (예약 실행은 항상 둘 다)"
        type: choice
        options: ["both", "kr", "us"]
        default: "both"

permissions:
  contents: write

# Its own group, like the other three writers. All push to signal-history on
# disjoint paths and each rebases and retries, so queueing behind one another
# would only mean a waiting run gets cancelled by the next trigger.
concurrency:
  group: signal-history-fundamentals
  cancel-in-progress: false

jobs:
  kr:
    if: github.event_name == 'schedule' || ((inputs.region == 'both' || inputs.region == 'kr') && !startsWith(inputs.target, 'raw-'))
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check out signal-history branch (orphan-safe)
        run: |
          git config user.name "dart-fundamentals-bot"
          git config user.email "actions@github.com"
          mkdir -p fundamentals-work
          if git ls-remote --exit-code --heads origin signal-history; then
            git fetch origin signal-history
            git worktree add fundamentals-work origin/signal-history
            git -C fundamentals-work checkout -B signal-history
          else
            git worktree add --detach fundamentals-work
            git -C fundamentals-work checkout --orphan signal-history
            git -C fundamentals-work rm -rf . || true
          fi
          mkdir -p fundamentals-work/ledger/fundamentals/kr

      - name: Collect a slice
        env:
          DART_API_KEY: ${{ secrets.DART }}
        run: |
          python scripts/collect_dart_fundamentals.py \
            fundamentals-work/ledger/fundamentals/kr \
            --target "${{ inputs.target || 'auto' }}" \
            --max-calls "${{ inputs.max_calls || '1500' }}" \
            --max-minutes "${{ inputs.max_minutes || '240' }}" \
            | tee collect.log

      - name: Commit & push to signal-history
        run: |
          cd fundamentals-work
          git add ledger/fundamentals
          if git diff --cached --quiet; then
            echo "no new filings"
            exit 0
          fi
          git commit -m "fundamentals: DART ${{ inputs.target || 'auto' }} slice for $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            if git push origin signal-history; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the remote"
            git fetch origin signal-history
            if ! git rebase origin/signal-history; then
              git rebase --abort || true
              echo "could not rebase onto signal-history"
              exit 1
            fi
          done
          echo "push failed after 5 attempts"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo '## DART 재무 수집'
            echo
            echo '```'
            tail -n 30 collect.log 2>/dev/null || echo '수집 출력 없음'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  us:
    if: github.event_name == 'schedule' || ((inputs.region == 'both' || inputs.region == 'us') && !startsWith(inputs.target, 'raw-'))
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # The collector is standard-library only, but `historical_store` — which
      # writes the byte-deterministic shards — is shared with the replay.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # WHY THE SCHEDULED BUDGET IS THE WHOLE BACKFILL. A budget is a ceiling,
      # not a target: once the store has caught up the work list is empty and
      # the run ends in seconds, so a large ceiling costs nothing on an ordinary
      # day. What it buys is the days before that. At the 1,500 calls the first
      # two slices used, the remaining 13,580 windows would take nine more
      # nights of someone remembering to press the button; at 1.1s of pacing
      # they are 249 minutes, which fits in one scheduled run.
      #
      # The pacing is what the rate limit cares about (54 calls a minute, under
      # finnhub's 60), and that does not change. What is untested is whether a
      # run this long meets a daily quota the two shorter ones never reached.
      # If it does, the collector stops on the refusal and does NOT mark the
      # window done, so the next night resumes where it stopped and we will
      # have measured where the real cap is. Nothing is lost either way.

      - name: Check out signal-history branch (orphan-safe)
        run: |
          git config user.name "us-fundamentals-bot"
          git config user.email "actions@github.com"
          mkdir -p us-fundamentals-work
          if git ls-remote --exit-code --heads origin signal-history; then
            git fetch origin signal-history
            git worktree add us-fundamentals-work origin/signal-history
            git -C us-fundamentals-work checkout -B signal-history
          else
            git worktree add --detach us-fundamentals-work
            git -C us-fundamentals-work checkout --orphan signal-history
            git -C us-fundamentals-work rm -rf . || true
          fi
          mkdir -p us-fundamentals-work/ledger/fundamentals/us

      - name: Collect a slice
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB }}
        run: |
          python scripts/collect_finnhub_fundamentals.py \
            us-fundamentals-work/ledger/fundamentals/us \
            --max-calls "${{ inputs.max_calls || '16600' }}" \
            --max-minutes "${{ inputs.max_minutes || '300' }}" \
            | tee us-collect.log

      # A US 10-Q states both a three-month and a year-to-date figure, and the
      # vendor flattens one of them into `report.ic`. Which one decides how TTM
      # has to be built, and reading a year-to-date cash flow as a quarterly one
      # inflates free cash flow fourfold with nothing raising an error. So it is
      # measured from the collected values — the median half-over-first and
      # three-quarters-over-first ratio across companies — exactly as the Korean
      # side settled the same question. Exit 2 means the data does not yet
      # decide; that is an honest outcome and not a broken run, so the step
      # records it instead of failing the collection that just succeeded.
      - name: Measure what a 10-Q period means
        id: semantics
        run: |
          set +e
          python scripts/measure_us_period_semantics.py \
            us-fundamentals-work/ledger/fundamentals/us \
            --json us-fundamentals-work/ledger/fundamentals/us/period-semantics.json \
            | tee us-semantics.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit & push to signal-history
        run: |
          cd us-fundamentals-work
          git add ledger/fundamentals
          if git diff --cached --quiet; then
            echo "no new filings"
            exit 0
          fi
          git commit -m "fundamentals: finnhub US slice for $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            if git push origin signal-history; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the remote"
            git fetch origin signal-history
            if ! git rebase origin/signal-history; then
              git rebase --abort || true
              echo "could not rebase onto signal-history"
              exit 1
            fi
          done
          echo "push still rejected after five attempts"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo '## 미국 PIT 재무 수집 (finnhub)'
            echo
            echo '```'
            tail -n 60 us-collect.log 2>/dev/null || echo '수집 출력 없음'
            echo '```'
            echo
            echo '### 10-Q 기간 의미 (누계인가 독립 분기인가)'
            echo
            echo '```'
            cat us-semantics.log 2>/dev/null || echo '측정 출력 없음'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # kr-accounting-coverage-repair-v1. Re-collects DART statement responses WHOLE
  # (every row, every attempt's real status) for every ticker ever in a KR
  # top-120 snapshot, into `ledger/fundamentals/kr-raw` -- never into
  # `ledger/fundamentals/kr`, whose 28 blobs are the sealed v4 execution input.
  # Then rebuilds `kr-canonical-v2` from it and audits that CANDIDATE store's
  # feature coverage against the sealed snapshot's own membership, prices
  # (backward tradability only) and denominator. Outcome-free throughout.
  kr-raw:
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.target, 'raw-')
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      SEALED_SIGNAL_HISTORY_COMMIT: 4ea107ed0cde289f0a049a65ff13d2441a786710
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check out signal-history (writable head + sealed commit, read-only)
        run: |
          git config user.name "dart-raw-statements-bot"
          git config user.email "actions@github.com"
          git fetch origin signal-history
          git worktree add raw-work origin/signal-history
          git -C raw-work checkout -B signal-history
          git worktree add --detach sealed-work "$SEALED_SIGNAL_HISTORY_COMMIT"
          test "$(git -C sealed-work rev-parse HEAD)" = "$SEALED_SIGNAL_HISTORY_COMMIT"
          mkdir -p raw-work/ledger/fundamentals/kr-raw

      - name: Probe fiscal-2015 quarterly availability (writes nothing to the store)
        if: inputs.target == 'raw-probe-2015'
        env:
          DART_API_KEY: ${{ secrets.DART }}
        run: |
          set -o pipefail
          python scripts/collect_dart_raw_statements.py raw-work/ledger/fundamentals/kr-raw \
            --universe-dir sealed-work/ledger/universe/kr --mode probe-2015 --dump-entries \
            --probe-tickers 8 --max-calls 200 --probe-output probe-2015.json | tee raw.log

      - name: Collect original fiscal-2015 XBRL filings (CANDIDATE_UNCONFIRMED accounts)
        if: inputs.target == 'raw-xbrl-2015'
        env:
          DART_API_KEY: ${{ secrets.DART }}
        run: |
          set -o pipefail
          python scripts/collect_dart_xbrl_originals.py raw-work/ledger/fundamentals/kr-xbrl-original \
            --universe-dir sealed-work/ledger/universe/kr \
            --max-calls "${{ inputs.max_calls || '1800' }}" \
            --max-minutes "${{ inputs.max_minutes || '290' }}" | tee raw.log

      - name: Merge with any existing canonical-v2 store and audit the candidate's coverage
        if: inputs.target == 'raw-xbrl-2015'
        run: |
          set -o pipefail
          python scripts/merge_kr_candidate_snapshot.py raw-work/ledger/fundamentals/kr-candidate-merged \
            --canonical-dir raw-work/ledger/fundamentals/kr-canonical-v2 \
            --xbrl-dir raw-work/ledger/fundamentals/kr-xbrl-original | tee canonical.log
          python scripts/audit_kr_accounting_coverage.py --input-root sealed-work \
            --kr-fundamentals-dir raw-work/ledger/fundamentals/kr-candidate-merged \
            --absent-json raw-work/ledger/fundamentals/kr-raw/absent.json \
            --output-dir raw-work/ledger/fundamentals/kr-candidate-merged/coverage-audit | tee audit.log

      # The probe's exact answers (every status and message, the filing index,
      # the XBRL package sizes) kept as a reviewable file, not only a log tail.
      - name: Upload fiscal-2015 probe evidence
        if: always() && inputs.target == 'raw-probe-2015'
        uses: actions/upload-artifact@v4
        with:
          name: dart-fiscal-2015-probe
          path: |
            probe-2015.json
            raw.log
          if-no-files-found: warn

      - name: Collect a slice of raw statement rows
        if: inputs.target == 'raw-statements'
        env:
          DART_API_KEY: ${{ secrets.DART }}
        run: |
          set -o pipefail
          python scripts/collect_dart_raw_statements.py raw-work/ledger/fundamentals/kr-raw \
            --universe-dir sealed-work/ledger/universe/kr --mode collect \
            --years "${{ inputs.raw_years || '2015,2016,2024,2025,2023,2017,2018,2019,2020,2021,2022,2026' }}" \
            --max-calls "${{ inputs.max_calls || '1800' }}" \
            --max-minutes "${{ inputs.max_minutes || '290' }}" | tee raw.log

      - name: Rebuild canonical filings and audit the candidate's coverage
        if: inputs.target == 'raw-statements'
        run: |
          set -o pipefail
          python scripts/build_kr_canonical_filings.py raw-work/ledger/fundamentals/kr-raw \
            raw-work/ledger/fundamentals/kr-canonical-v2 \
            --legacy-dir sealed-work/ledger/fundamentals/kr | tee canonical.log
          if [ -d raw-work/ledger/fundamentals/kr-xbrl-original ]; then
            python scripts/merge_kr_candidate_snapshot.py raw-work/ledger/fundamentals/kr-candidate-merged \
              --canonical-dir raw-work/ledger/fundamentals/kr-canonical-v2 \
              --xbrl-dir raw-work/ledger/fundamentals/kr-xbrl-original | tee -a canonical.log
            AUDIT_DIR=raw-work/ledger/fundamentals/kr-candidate-merged
          else
            AUDIT_DIR=raw-work/ledger/fundamentals/kr-canonical-v2
          fi
          python scripts/audit_kr_accounting_coverage.py --input-root sealed-work \
            --kr-fundamentals-dir "$AUDIT_DIR" \
            --absent-json raw-work/ledger/fundamentals/kr-raw/absent.json \
            --output-dir "$AUDIT_DIR/coverage-audit" | tee audit.log

      - name: Commit & push to signal-history
        if: inputs.target == 'raw-statements' || inputs.target == 'raw-xbrl-2015'
        run: |
          cd raw-work
          # `raw-xbrl-2015` alone never creates kr-canonical-v2 (that is
          # raw-statements' own rebuild step) -- a bare `git add` on a path
          # that does not exist at all is a hard git error ("did not match
          # any files"), not a no-op, and would abort the commit before
          # anything real gets pushed. Add only the paths this run actually
          # produced.
          for path in ledger/fundamentals/kr-raw ledger/fundamentals/kr-canonical-v2 \
                      ledger/fundamentals/kr-xbrl-original ledger/fundamentals/kr-candidate-merged; do
            if [ -e "$path" ]; then
              git add "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "no new raw filings"
            exit 0
          fi
          git commit -m "fundamentals: DART raw statement rows (PIT KR universe) $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            if git push origin signal-history; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the remote"
            git fetch origin signal-history
            if ! git rebase origin/signal-history; then
              git rebase --abort || true
              echo "could not rebase onto signal-history"
              exit 1
            fi
          done
          echo "push failed after 5 attempts"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo '## DART 원본 행 재수집 / 2015 분기 탐침'
            echo
            echo '```'
            tail -n 80 raw.log 2>/dev/null || echo '수집 출력 없음'
            echo '```'
            echo
            echo '### 계정 매핑 증거 (IFRS 요소로만 허용된 행)'
            echo '```'
            cat canonical.log 2>/dev/null || echo '재구성 없음'
            echo '```'
            echo
            echo '### 후보 스냅샷 커버리지 게이트 (outcome-free)'
            echo '```'
            cat audit.log 2>/dev/null || echo '감사 없음'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
