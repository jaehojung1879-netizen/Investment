name: Tests

# Nothing ran the suite before this. Every PR to date has claimed "N tests
# pass" on the author's word alone, and the expensive workflows only discover
# a broken import after the checkout, the install and the fetch — on the
# replay, forty minutes in.
#
# This is deliberately the cheap half: unit tests and an import check, no
# network, no secrets. The replay stays the place where real data is proved.

on:
  pull_request:
  push:
    branches: [main, research/regional-rotation-validation-v1]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      # Full history: `pipeline.kr_xbrl_value_validation` proves by
      # `git merge-base --is-ancestor` that the pre-source freeze commit is in
      # this checkout's history. A shallow clone cannot contain it, which failed
      # two tests for an infrastructure reason, not a scientific one.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # The frozen KR accounting snapshot is verified against its pinned source
      # commit (accounting shards only, never a checkout of that branch).
      - name: Fetch the pinned KR accounting and sealed raw-input commits
        run: |
          git fetch --no-tags --depth=1 origin fb6e83743fd8cdba647d1522a4645b662a9d5647
          git fetch --no-tags --depth=1 --filter=blob:none origin 4ea107ed0cde289f0a049a65ff13d2441a786710

      # Cheapest first, and it catches a class the suite structurally cannot:
      # a name the tests never reach, an import two modules disagree about, a
      # value computed and then dropped. `ruff.toml` argues the rule set; it is
      # narrow on purpose and reports zero findings today, so any output here
      # is a regression rather than a backlog.
      - name: Lint
        run: ruff check --output-format=github .

      - name: Run the suite
        run: python -m pytest -q

      # The scheduled jobs import these at the top of a run that has already
      # paid for a checkout and an install. A NameError here costs seconds.
      - name: Import every entry point
        run: |
          python - <<'PY'
          import importlib, pathlib, sys
          sys.path.insert(0, ".")
          failed = []
          for path in sorted(pathlib.Path("pipeline").glob("*.py")):
              if path.stem == "__init__":
                  continue
              try:
                  importlib.import_module(f"pipeline.{path.stem}")
              except Exception as exc:
                  failed.append(f"pipeline.{path.stem}: {exc!r}")
          for path in sorted(pathlib.Path("scripts").glob("*.py")):
              try:
                  compile(path.read_text(encoding="utf-8"), str(path), "exec")
              except SyntaxError as exc:
                  failed.append(f"{path}: {exc!r}")
          if failed:
              print("\n".join(failed))
              raise SystemExit(1)
          print("all pipeline modules import and all scripts compile")
          PY

  # Authoring PR only, once: no new workflow filename / frozen census change.
  # Existing pytest job above stays byte-identical. No network on synchronize,
  # main push, forks, reopened PRs or rerun attempts. No scheduled trigger.
  us-real-source-preflight:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/us-real-source-preflight-v1' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      summary: ${{ steps.probe.outputs.summary }}
      verdict: ${{ steps.probe.outputs.verdict }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install existing pinned dependencies
        run: pip install -r requirements.txt
      - name: Real Yahoo benchmark-first bounded diagnostic
        id: probe
        env:
          PREFLIGHT_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          PREFLIGHT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python scripts/preflight_us_real_sources.py --output "$RUNNER_TEMP/us-real-source-preflight"
      - name: Preserve actual source and isolated collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-real-source-preflight-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/us-real-source-preflight/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Verdict PASS
        if: steps.probe.outputs.verdict == 'PASS'
        run: echo 'PASS applies only to this bounded diagnostic, not daily operational readiness.'
      - name: Verdict PARTIAL
        if: steps.probe.outputs.verdict == 'PARTIAL'
        run: echo 'PARTIAL - some actual records retained; sample or integrity blocked.'
      - name: Verdict BLOCKED
        if: steps.probe.outputs.verdict == 'BLOCKED'
        run: echo 'BLOCKED - no valid actual price records; consult original failure evidence.'

  us-preflight-evidence:
    needs: us-real-source-preflight
    if: needs.us-real-source-preflight.result == 'success'
    name: US evidence | ${{ needs.us-real-source-preflight.outputs.summary }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Source evidence recorded; no network requests in this job
        run: echo 'The job name records measured counts and classification. See the source artifact for exact evidence.'
