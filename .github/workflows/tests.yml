name: Tests

# Nothing ran the suite before this. Every PR to date has claimed "N tests
# pass" on the author's word alone, and the expensive workflows only discover
# a broken import after the checkout, the install and the fetch — on the
# replay, forty minutes in.
#
# This is deliberately the cheap half: unit tests and an import check, no
# network, no secrets. The replay stays the place where real data is proved.

on:
  pull_request:
  push:
    branches: [main, research/regional-rotation-validation-v1]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      # Full history: `pipeline.kr_xbrl_value_validation` proves by
      # `git merge-base --is-ancestor` that the pre-source freeze commit is in
      # this checkout's history. A shallow clone cannot contain it, which failed
      # two tests for an infrastructure reason, not a scientific one.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # The frozen KR accounting snapshot is verified against its pinned source
      # commit (accounting shards only, never a checkout of that branch).
      - name: Fetch the pinned KR accounting and sealed raw-input commits
        run: |
          git fetch --no-tags --depth=1 origin fb6e83743fd8cdba647d1522a4645b662a9d5647
          git fetch --no-tags --depth=1 --filter=blob:none origin 4ea107ed0cde289f0a049a65ff13d2441a786710

      # Cheapest first, and it catches a class the suite structurally cannot:
      # a name the tests never reach, an import two modules disagree about, a
      # value computed and then dropped. `ruff.toml` argues the rule set; it is
      # narrow on purpose and reports zero findings today, so any output here
      # is a regression rather than a backlog.
      - name: Lint
        run: ruff check --output-format=github .

      - name: Run the suite
        run: python -m pytest -q

      # The scheduled jobs import these at the top of a run that has already
      # paid for a checkout and an install. A NameError here costs seconds.
      - name: Import every entry point
        run: |
          python - <<'PY'
          import importlib, pathlib, sys
          sys.path.insert(0, ".")
          failed = []
          for path in sorted(pathlib.Path("pipeline").glob("*.py")):
              if path.stem == "__init__":
                  continue
              try:
                  importlib.import_module(f"pipeline.{path.stem}")
              except Exception as exc:
                  failed.append(f"pipeline.{path.stem}: {exc!r}")
          for path in sorted(pathlib.Path("scripts").glob("*.py")):
              try:
                  compile(path.read_text(encoding="utf-8"), str(path), "exec")
              except SyntaxError as exc:
                  failed.append(f"{path}: {exc!r}")
          if failed:
              print("\n".join(failed))
              raise SystemExit(1)
          print("all pipeline modules import and all scripts compile")
          PY

  # TEMPORARY_OWNER_AUTHORIZED_FULL_UNIVERSE_DRY_RUN_V1
  us-full-universe-dry-run:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'opened' &&
      github.head_ref == 'data/us-full-universe-real-dry-run-v1' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      summary: ${{ steps.source.outputs.summary }}
      detail: ${{ steps.source.outputs.detail }}
      verdict: ${{ steps.source.outputs.verdict }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: One observed full-universe completed session
        id: source
        env:
          PREFLIGHT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREFLIGHT_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python scripts/dry_run_us_full_universe.py --output "$RUNNER_TEMP/us-full-universe-stage"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-full-universe-dry-run-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/us-full-universe-stage/
          retention-days: 90
          if-no-files-found: error
  us-full-universe-metrics:
    needs: us-full-universe-dry-run
    if: always() && needs.us-full-universe-dry-run.result != 'skipped'
    name: "US full-universe | ${{ needs.us-full-universe-dry-run.outputs.summary }}"
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Measured collection verdict is distinct from diagnostic job success. See preserved artifact.'
  us-full-universe-actions-evidence:
    needs: us-full-universe-dry-run
    if: always() && needs.us-full-universe-dry-run.result != 'skipped'
    name: "US actions | ${{ needs.us-full-universe-dry-run.outputs.detail }}"
    runs-on: ubuntu-latest
    steps:
      - run: echo 'One session; no production activation or historical membership claim.'
