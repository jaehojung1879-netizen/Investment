name: Regional alpha model v1

on:
  workflow_dispatch:
  push:
    branches: [research/regional-alpha-model-v1]
    paths:
      - 'pipeline/regional_alpha_*.py'
      - 'scripts/*regional_alpha*.py'
      - 'tests/test_regional_alpha_model.py'
      - 'data/research/regional-alpha-model-v1/**'
      - '.github/workflows/regional-alpha-model.yml'

permissions:
  contents: read

concurrency:
  group: regional-alpha-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned existing dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify code and invariants
        run: |
          ruff check .
          python -m compileall pipeline scripts
          pytest -q
      - name: Fetch verified immutable research inputs
        run: python -u scripts/fetch_regional_alpha_inputs.py replay-work
      - name: Run the frozen study twice
        run: |
          python -u scripts/run_regional_alpha_model.py replay-work/ledger --output-dir study-a
          python -u scripts/run_regional_alpha_model.py replay-work/ledger --output-dir study-b
          diff -qr study-a study-b
      - name: Verify checked-in result when available
        run: |
          if test -f docs/results/regional-alpha-model-v1-report.json; then
            cmp study-a/regional-alpha-model-v1-report.json docs/results/regional-alpha-model-v1-report.json
            cmp study-a/regional-alpha-model-v1-report.md docs/results/regional-alpha-model-v1-report.md
          fi
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regional-alpha-model-v1-discovery-only
          path: study-a/
          if-no-files-found: warn
      - name: Summary
        if: always()
        run: |
          if test -f study-a/regional-alpha-model-v1-report.md; then
            cat study-a/regional-alpha-model-v1-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
