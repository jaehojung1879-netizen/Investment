name: Alpha risk separation

# Read-only research CHALLENGER. Consumes the same pinned replay-v16 ledger
# the other research analyses do, and writes only job artifacts in the code
# checkout — never inside the sealed ledger.
#
# `alpha-reliability-v1` measured that a five-name book is decided at its
# margin, where most cuts are between names the calibration scores
# identically, and that a defensive tilt (downside volatility, the `lowvol`
# sleeve) is visible in what is held. This removes ONLY the downside-
# volatility denominator from the selection score — the `lowvol` sleeve
# weight and inverse-volatility position sizing stay exactly as they are —
# and measures whether that tilt survives.
on:
  workflow_dispatch:
  push:
    branches: [research/alpha-risk-separation-v1]
    paths:
      - 'pipeline/alpha_risk_separation.py'
      - 'pipeline/alpha_reliability.py'
      - 'pipeline/signal_persistence.py'
      - 'pipeline/switch_hurdle.py'
      - 'pipeline/benchmark_alpha.py'
      - 'pipeline/kelly_portfolio.py'
      - 'pipeline/portfolio_validation.py'
      - 'pipeline/selection_value.py'
      - 'scripts/run_alpha_risk_separation_replay.py'
      - 'tests/test_alpha_risk_separation.py'
      - '.github/workflows/alpha-risk-separation.yml'
      - 'docs/results/alpha-risk-separation-*'

permissions:
  contents: read

concurrency:
  group: alpha-risk-separation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alpha-risk-separation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout research code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test the axis is the score's denominator and nothing else
        run: >-
          python -m pytest -q
          tests/test_alpha_risk_separation.py
          tests/test_alpha_reliability.py
          tests/test_signal_persistence.py
          tests/test_switch_hurdle.py
          tests/test_selection_value.py
          tests/test_portfolio_validation.py

      - name: Check out pinned sealed inputs (read-only)
        uses: actions/checkout@v5
        with:
          ref: b71d8cb5ce21815980d28b606852f9294d43cc53
          path: replay-work
          persist-credentials: false

      - name: Run the risk-separation ladder
        run: |
          set -o pipefail
          python -u scripts/run_alpha_risk_separation_replay.py replay-work/ledger \
            --output alpha-risk-separation-report.json \
            --markdown alpha-risk-separation-report.md \
            | tee alpha-risk-separation.log

      - name: Verify sealed checkout unchanged
        run: test -z "$(git -C replay-work status --porcelain)"

      - name: Verify checked-in deterministic result when present
        run: |
          if test -f docs/results/alpha-risk-separation-report.json; then
            cmp alpha-risk-separation-report.json docs/results/alpha-risk-separation-report.json
            cmp alpha-risk-separation-report.md docs/results/alpha-risk-separation-report.md
          fi

      - name: Upload analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-risk-separation-v1
          path: |
            alpha-risk-separation-report.json
            alpha-risk-separation-report.md
            alpha-risk-separation.log
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          if test -f alpha-risk-separation-report.md; then
            cat alpha-risk-separation-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            tail -n 100 alpha-risk-separation.log >> "$GITHUB_STEP_SUMMARY"
          fi
