name: KR factor anatomy v1
# EXPLORATORY / DEVELOPMENT / HYPOTHESIS-GENERATING. Pull requests run `verify` only (synthetic tests plus outcome-free
# identity). `execute` exists only as a manual workflow_dispatch on merged main, after the guard below, and never
# invokes the sealed kr-model-overlay-portfolio-v1 execute workflow or contacts KRX.
on:
  pull_request:
    paths:
      - 'pipeline/kr_factor_anatomy*'
      - 'scripts/run_kr_factor_anatomy_v1.py'
      - 'research_specs/kr-factor-anatomy-v1*'
      - 'tests/test_kr_factor_anatomy_v1.py'
      - 'docs/kr-factor-anatomy-v1-design.md'
      - '.github/workflows/kr-factor-anatomy-v1.yml'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [verify, execute]
        default: verify
      inputArtifact:
        description: Exact preserved raw-input artifact name (required for execute)
        type: string
        required: false
      inputRunId:
        description: Producing workflow run ID of the exact raw snapshot (required for execute)
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: kr-factor-anatomy-v1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frozen-machine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Synthetic tests and outcome-free identity verification
        run: |
          ruff check .
          python -m pytest -q tests/test_kr_factor_anatomy_v1.py
          python scripts/run_kr_factor_anatomy_v1.py --mode verify --output run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kr-factor-anatomy-v1-verify-${{ github.run_id }}
          path: run
          retention-days: 30
  execute:
    # Never on pull_request. Requires an explicit manual dispatch with mode=execute.
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'execute'
    needs: frozen-machine
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ANATOMY_INPUT_ARTIFACT: ${{ inputs.inputArtifact }}
      ANATOMY_INPUT_RUN_ID: ${{ inputs.inputRunId }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Main-only guard, committed spec and exact preserved artifact
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            if (context.ref !== 'refs/heads/main') throw new Error('MAIN_ONLY');
            const main = await github.rest.git.getRef({...context.repo, ref: 'heads/main'});
            if (main.data.object.sha !== context.sha) throw new Error('MAIN_HEAD_CHANGED');
            const specPath = 'research_specs/kr-factor-anatomy-v1.json';
            for (const p of [specPath, 'research_specs/kr-factor-anatomy-v1.sha256']) {
              const committed = cp.execFileSync('git', ['show', 'HEAD:' + p]);
              if (!committed.equals(fs.readFileSync(p))) throw new Error('SPEC_NOT_COMMITTED_AT_HEAD');
            }
            const spec = JSON.parse(fs.readFileSync(specPath));
            const pin = spec.input;
            if (process.env.ANATOMY_INPUT_ARTIFACT !== pin.artifactName || process.env.ANATOMY_INPUT_RUN_ID !== String(pin.producingRunId)) throw new Error('INPUT_ARTIFACT_IDENTITY_MISMATCH');
            if (fs.existsSync(spec.execution.resultPath)) throw new Error('ANATOMY_ALREADY_SEALED');
            const art = await github.rest.actions.getArtifact({...context.repo, artifact_id: pin.artifactId});
            const a = art.data;
            if (a.expired || a.name !== pin.artifactName || String(a.workflow_run.id) !== String(pin.producingRunId) || a.digest !== 'sha256:' + pin.artifactArchiveSha256) throw new Error('PRESERVED_ARTIFACT_IDENTITY_MISMATCH');
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Download the exact preserved raw snapshot
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.inputArtifact }}
          path: inputs
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.inputRunId }}
      - name: Exploratory anatomy execution (identity verified before any outcome)
        run: python scripts/run_kr_factor_anatomy_v1.py --mode execute --inputs inputs --output run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kr-factor-anatomy-v1-results-${{ github.run_id }}
          path: run
          retention-days: 90
