name: Append paper-signal ledger

# Accumulates the immutable paper-signal ledger on a DEDICATED branch
# (signal-history) so it never triggers the main Pages build (no recursion).
# Runs after the daily data build has had time to publish.

on:
  schedule:
    - cron: "10 0 * * *"   # after the 23:20 UTC production build
  workflow_dispatch:

permissions:
  contents: write

# Its own group, like the deploy and the replay. All three push to
# signal-history on disjoint paths — signals/outcomes/summary here, ledger
# history there, state/ from the deploy — and each rebases and retries rather
# than queueing behind the others, where only one run could ever be pending and
# the next trigger cancelled whichever was waiting.
concurrency:
  group: signal-history-ledger
  cancel-in-progress: false

jobs:
  append-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch prior production state
        run: |
          mkdir -p .state
          if git fetch origin signal-history; then
            if git show origin/signal-history:state/latest.json > .state/latest.json; then
              echo "PRIOR_STATE_PATH=$GITHUB_WORKSPACE/.state/latest.json" >> "$GITHUB_ENV"
            fi
            if git show origin/signal-history:ledger/outcomes.jsonl > .state/outcomes.jsonl; then
              echo "PAPER_OUTCOMES_PATH=$GITHUB_WORKSPACE/.state/outcomes.jsonl" >> "$GITHUB_ENV"
            fi
            if git show origin/signal-history:ledger/summary.json > .state/summary.json; then
              echo "PAPER_SUMMARY_PATH=$GITHUB_WORKSPACE/.state/summary.json" >> "$GITHUB_ENV"
            fi
            # The historical ledger is a directory of gzipped month shards, not
            # a single file, so it is extracted as a tree.
            if git cat-file -e origin/signal-history:ledger/historical 2>/dev/null; then
              git archive origin/signal-history ledger/historical | tar -x -C .state
              echo "HISTORICAL_LEDGER_DIR=$GITHUB_WORKSPACE/.state/ledger" >> "$GITHUB_ENV"
            fi
            if git show origin/signal-history:ledger/historical-diagnostics.json > .state/historical-diagnostics.json; then
              echo "HISTORICAL_DIAGNOSTICS_PATH=$GITHUB_WORKSPACE/.state/historical-diagnostics.json" >> "$GITHUB_ENV"
            fi
            if git show origin/signal-history:ledger/historical-portfolio-validation.json > .state/historical-portfolio-validation.json; then
              echo "HISTORICAL_PORTFOLIO_VALIDATION_PATH=$GITHUB_WORKSPACE/.state/historical-portfolio-validation.json" >> "$GITHUB_ENV"
            fi
            if git show origin/signal-history:ledger/opportunity-model.json > .state/opportunity-model.json; then
              echo "OPPORTUNITY_MODEL_PATH=$GITHUB_WORKSPACE/.state/opportunity-model.json" >> "$GITHUB_ENV"
            fi
            if git show origin/signal-history:ledger/warning-model.json > .state/warning-model.json; then
              echo "WARNING_MODEL_PATH=$GITHUB_WORKSPACE/.state/warning-model.json" >> "$GITHUB_ENV"
            fi
          fi

      - name: Build today's artifact
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python -m pipeline.build

      - name: Validate production artifact
        run: python -m pipeline.validate data/site-data.json

      - name: Check out signal-history branch (orphan-safe)
        run: |
          git config user.name "signal-ledger-bot"
          git config user.email "actions@github.com"
          mkdir -p ledger-work
          if git ls-remote --exit-code --heads origin signal-history; then
            git fetch origin signal-history
            git worktree add ledger-work origin/signal-history
            git -C ledger-work checkout -B signal-history
          else
            git worktree add --detach ledger-work
            git -C ledger-work checkout --orphan signal-history
            git -C ledger-work rm -rf . || true
            mkdir -p ledger-work/ledger
          fi

      - name: Append signals + refresh outcomes
        run: python scripts/update_ledger.py data/site-data.json ledger-work/ledger

      # weekly-passive-first-v1: per-region 0-5 stocks / benchmark fallback,
      # derived from the same validated artifact the paper ledger records.
      # Writes the published decision (ledger/weekly-decisions/latest.json, read
      # by the site) and appends FINAL week-end receipts; an existing
      # (policy, region, asOfDate) receipt is never rewritten. Kept in this
      # workflow because pages.yml and the workflow census are byte-pinned by
      # sealed studies. No order is placed and no notification is sent.
      # A refused weekly publication must never cost the paper ledger its day:
      # the step warns, writes nothing, and the site keeps showing the last
      # published decision with its own true asOfDate.
      - name: Weekly decision and append-only receipts
        continue-on-error: true
        run: |
          mkdir -p ledger-work/ledger/weekly-decisions .state/weekly
          if python -m pipeline.weekly_publish data/site-data.json \
               ledger-work/ledger/weekly-decisions/receipts.jsonl \
               .state/weekly/latest.json .state/weekly/receipts.jsonl; then
            cp .state/weekly/latest.json ledger-work/ledger/weekly-decisions/latest.json
            cp .state/weekly/receipts.jsonl ledger-work/ledger/weekly-decisions/receipts.jsonl
          else
            echo "::warning::weekly decision refused; nothing written"
            exit 1
          fi

      - name: Commit & push to signal-history
        run: |
          cd ledger-work
          git add ledger
          if git diff --cached --quiet; then
            echo "no ledger changes"
            exit 0
          fi
          git commit -m "ledger: append signals for $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            if git push origin signal-history; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the remote"
            git fetch origin signal-history
            if ! git rebase origin/signal-history; then
              git rebase --abort || true
              echo "could not rebase onto signal-history"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "could not push after 5 attempts"
          exit 1
