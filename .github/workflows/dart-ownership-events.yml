name: Collect DART ownership events

# `auto` (the default) is the one button an operator needs: a small schema
# probe runs first, and collection proceeds automatically only if that probe
# reports `SERVED` — every expected field present on a real response. If the
# source or key is refused, or an expected field goes missing (schema
# drift), the run stops there and is never reported as a successful
# collection. `probe`/`collect` stay available as explicit manual overrides
# (e.g. re-running a probe alone to check status, or forcing a collection
# after independently confirming things are fine) — see
# `docs/workflow-inventory.md` for why the two steps are not fused into one
# unconditional job: a probe call and a bulk collection call cost DART's
# daily quota very differently, and forcing collection to always re-probe
# first would spend part of that quota on every single collection run.
#
# `dart_ownership_events.py`'s field set was corroborated from third-party
# libraries wrapping DART's own DS004 (majorstock.json) endpoint; a live
# probe (Actions run 35964461327, 2026-09-24) has since confirmed all 10
# expected fields are served and measured `report_tp`'s real values
# ("일반"/"약식") — see that module's docstring for the correction.
#
# This is the SAME vendor and SAME key `fundamentals.yml` already uses for
# DART's statement endpoint (DS002); a key subscribed to DS002 is not
# guaranteed subscribed to DS004, which is exactly the first thing the probe
# checks.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto=스키마 확인 후 자동 수집 / probe=확인만 / collect=확인 없이 강제 수집"
        type: choice
        options: ["auto", "probe", "collect"]
        default: "auto"
      samples:
        description: "probe(및 auto의 게이트) 전용 — 확인할 종목코드 목록"
        type: string
        default: "005930,000660,035420"
      max_calls:
        description: "collect 전용 — 최대 호출 수 (회사 수와 같음)"
        type: string
        default: "200"
      max_minutes:
        description: "collect 전용 — 최대 분"
        type: string
        default: "60"

permissions:
  contents: write

concurrency:
  group: signal-history-dart-ownership-events
  cancel-in-progress: false

jobs:
  probe:
    if: inputs.mode == 'probe' || inputs.mode == 'auto'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      verdict: ${{ steps.run.outputs.verdict }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Probe majorstock.json
        id: run
        env:
          DART_API_KEY: ${{ secrets.DART }}
        run: |
          python scripts/probe_dart_ownership_events.py \
            --output dart-ownership-probe.json --samples "${{ inputs.samples }}" \
            | tee probe.log

      - name: Upload the probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dart-ownership-probe
          path: |
            dart-ownership-probe.json
            probe.log
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo '## DART ownership events probe'
            echo
            echo '```'
            tail -n 120 probe.log 2>/dev/null || echo 'no probe output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  collect:
    needs: [probe]
    # `always()` so `collect` mode's forced run is not skipped just because
    # its own `probe` job (which never ran for it) reports nothing; `mode ==
    # collect` bypasses the gate entirely, and `auto` requires SERVED.
    if: |
      always() &&
      (inputs.mode == 'collect' ||
       (inputs.mode == 'auto' && needs.probe.outputs.verdict == 'SERVED'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check out signal-history branch (orphan-safe)
        run: |
          git config user.name "dart-ownership-events-bot"
          git config user.email "actions@github.com"
          mkdir -p ownership-work
          if git ls-remote --exit-code --heads origin signal-history; then
            git fetch origin signal-history
            git worktree add ownership-work origin/signal-history
            git -C ownership-work checkout -B signal-history
          else
            git worktree add --detach ownership-work
            git -C ownership-work checkout --orphan signal-history
            git -C ownership-work rm -rf . || true
          fi
          mkdir -p ownership-work/ledger/dart-ownership-events

      - name: Collect a slice
        # Resumable via fetch-state.json, keyed by DART issuer identity and
        # raw contract. Failed calls stay pending; completed issuers are not
        # requested again unless the raw contract explicitly changes.
        env:
          DART_API_KEY: ${{ secrets.DART }}
        run: |
          python scripts/collect_dart_ownership_events.py \
            ownership-work/ledger/dart-ownership-events \
            --membership-history ownership-work/ledger/universe-history.json \
            --krx-universe-dir ownership-work/ledger/universe/kr \
            --max-calls "${{ inputs.max_calls || '200' }}" \
            --max-minutes "${{ inputs.max_minutes || '60' }}" \
            | tee collect.log

      - name: Commit & push to signal-history
        run: |
          cd ownership-work
          git add ledger/dart-ownership-events
          if git diff --cached --quiet; then
            echo "no new events"
            exit 0
          fi
          git commit -m "dart-ownership-events: slice for $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            if git push origin signal-history; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the remote"
            git fetch origin signal-history
            if ! git rebase origin/signal-history; then
              git rebase --abort || true
              echo "could not rebase onto signal-history"
              exit 1
            fi
          done
          echo "push failed after 5 attempts"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo '## DART ownership events collection'
            echo
            echo '```'
            tail -n 40 collect.log 2>/dev/null || echo 'no collection output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  gate-stopped:
    needs: [probe]
    if: inputs.mode == 'auto' && needs.probe.outputs.verdict != 'SERVED'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain why collection did not run
        run: |
          {
            echo '## DART ownership events — collection skipped'
            echo
            echo "probe verdict: \`${{ needs.probe.outputs.verdict }}\` (not \`SERVED\`)"
            echo
            echo 'Collection only runs automatically after a `SERVED` probe.'
            echo 'Check the probe job'"'"'s summary above for what refused it —'
            echo 'a repeat run will not help without a change on the source or key side.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "probe verdict was ${{ needs.probe.outputs.verdict }}, not SERVED — collection skipped" >&2
          exit 1
