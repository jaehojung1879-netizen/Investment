name: Entry selection separation

# Read-only research CHALLENGER. Consumes the same pinned replay-v16 ledger
# the other research analyses do, and writes only job artifacts in the code
# checkout — never inside the sealed ledger.
#
# `alpha-reliability-v1` pre-registered this as the fourth and final follow-up
# study: alpha should decide the held set, entry state should decide how fast
# the target weight is approached. Today's production shape discounts the
# SELECTION score directly with the entry-state multiplier; this moves that
# continuous throttle to a post-selection weight throttle and measures what
# changes, leaving every eligibility fact (including a fully blocking state)
# exactly as production computes it.
on:
  workflow_dispatch:
  push:
    branches: [research/entry-selection-separation-v1]
    paths:
      - 'pipeline/entry_selection_separation.py'
      - 'pipeline/alpha_reliability.py'
      - 'pipeline/kelly_portfolio.py'
      - 'pipeline/signal_persistence.py'
      - 'pipeline/switch_hurdle.py'
      - 'pipeline/benchmark_alpha.py'
      - 'pipeline/portfolio_validation.py'
      - 'pipeline/selection_value.py'
      - 'scripts/run_entry_selection_separation_replay.py'
      - 'tests/test_entry_selection_separation.py'
      - '.github/workflows/entry-selection-separation.yml'
      - 'docs/results/entry-selection-separation-*'

permissions:
  contents: read

concurrency:
  group: entry-selection-separation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  entry-selection-separation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout research code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test the throttle-only transform and that eligibility never moves
        run: >-
          python -m pytest -q
          tests/test_entry_selection_separation.py
          tests/test_region_quota_removal.py
          tests/test_dynamic_breadth.py
          tests/test_alpha_risk_separation.py
          tests/test_alpha_reliability.py
          tests/test_signal_persistence.py
          tests/test_switch_hurdle.py
          tests/test_selection_value.py
          tests/test_portfolio_validation.py
          tests/test_kelly_portfolio.py

      - name: Check out pinned sealed inputs (read-only)
        uses: actions/checkout@v5
        with:
          ref: b71d8cb5ce21815980d28b606852f9294d43cc53
          path: replay-work
          persist-credentials: false

      - name: Run the entry-selection-separation ladder
        run: |
          set -o pipefail
          python -u scripts/run_entry_selection_separation_replay.py replay-work/ledger \
            --output entry-selection-separation-report.json \
            --markdown entry-selection-separation-report.md \
            | tee entry-selection-separation.log

      - name: Verify sealed checkout unchanged
        run: test -z "$(git -C replay-work status --porcelain)"

      - name: Verify checked-in deterministic result when present
        run: |
          if test -f docs/results/entry-selection-separation-report.json; then
            cmp entry-selection-separation-report.json docs/results/entry-selection-separation-report.json
            cmp entry-selection-separation-report.md docs/results/entry-selection-separation-report.md
          fi

      - name: Upload analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entry-selection-separation-v1
          path: |
            entry-selection-separation-report.json
            entry-selection-separation-report.md
            entry-selection-separation.log
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          if test -f entry-selection-separation-report.md; then
            cat entry-selection-separation-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            tail -n 100 entry-selection-separation.log >> "$GITHUB_STEP_SUMMARY"
          fi
