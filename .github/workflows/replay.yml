name: Historical point-in-time replay

# Builds and extends the HISTORICAL_OOS evidence base on the same dedicated
# `signal-history` branch the prospective paper ledger lives on — in SEPARATE
# files, so the two evidence classes can never be confused for one another.
#
# Scheduled runs reproduce the sealed generation from frozen inputs.  Vendor
# acquisition is manual because a corrected sealed prefix must start a named
# DATA_VERSION/REPLAY_VERSION experiment; a cron job must never choose that
# semantic change by itself.  A full decade is acquired once per generation,
# then the daily schedule exercises the same snapshot and determinism gates.

on:
  schedule:
    # 02:40 UTC daily, well after the 00:10 UTC ledger job has settled.
    - cron: "40 2 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Recompute every replay date (needed when replay logic changes)"
        type: boolean
        default: false
      frozen_inputs:
        description: "Reproduce the committed input snapshot without fetching vendors"
        type: boolean
        default: false
      retrain:
        description: "Force the opportunity/warning model retrain"
        type: boolean
        default: false

permissions:
  contents: write

# Separate from the Pages deploy: a shared group holds only one pending run, so
# whichever of the two queued first was cancelled by the next trigger. Both
# jobs push to signal-history, on disjoint paths, and both rebase-and-retry.
concurrency:
  group: signal-history-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check out signal-history branch (orphan-safe)
        run: |
          git config user.name "historical-replay-bot"
          git config user.email "actions@github.com"
          if git ls-remote --exit-code --heads origin signal-history; then
            git fetch origin signal-history
            git worktree add replay-work origin/signal-history
            git -C replay-work checkout -B signal-history
          else
            git worktree add --detach replay-work
            git -C replay-work checkout --orphan signal-history
            git -C replay-work rm -rf . || true
          fi
          mkdir -p replay-work/ledger

      # Refresh index membership before the replay. The committed file is
      # US-only, built from the constituent repo's git history; this rebuild
      # also picks up the Korean half, which needs FinanceDataReader's delisting
      # list and therefore network.
      #
      # The accumulated file lives on signal-history, next to the ledger it
      # describes, and is restored here as the merge base. Without that the
      # Korean half would be rebuilt from nothing on every run and one KRX
      # outage would take the KR cross-section from ~2,500 described names to
      # zero — which the universe guard correctly refuses, blocking the daily
      # run for a reason that has nothing to do with the evidence. Carried
      # forward, an outage costs that run's refresh and nothing else.
      - name: Refresh point-in-time index membership
        if: github.event_name != 'schedule' && inputs.frozen_inputs != true
        run: |
          if [ -f replay-work/ledger/universe-history.json ]; then
            cp replay-work/ledger/universe-history.json data/universe-history.json
            echo "restored the accumulated membership file from signal-history"
          fi
          python scripts/build_universe_history.py data/universe-history.json \
            || echo "membership rebuild failed; using the carried-forward file"
          cp data/universe-history.json replay-work/ledger/universe-history.json
          python - <<'PY'
          import json, pathlib
          rows = json.loads(pathlib.Path("data/universe-history.json").read_text())
          by_region = {}
          for row in rows.values():
              key = row.get("region")
              by_region[key] = by_region.get(key, 0) + 1
          departed = sum(1 for r in rows.values() if r.get("delisted"))
          print(f"membership: {len(rows)} names {by_region}; {departed} no longer members")
          PY

      # Replay input payloads are immutable, content-addressed monthly shards.
      # The manifest pins exact prices, fundamentals, macro, FX and calendar inputs.

      # Value and quality need statements as they were visible on the date.
      # The filings are collected on their own schedule onto signal-history;
      # this turns whatever has arrived into the file the replay reads. An
      # empty store is not an error — it is the state the replay has been in
      # since it started, and it says so rather than failing the run.
      - name: Derive PIT fundamentals from the collected filings
        if: github.event_name != 'schedule' && inputs.frozen_inputs != true
        run: |
          python scripts/build_pit_fundamentals.py \
            replay-work/ledger/fundamentals/kr \
            --output replay-work/ledger/fundamentals/pit-kr.jsonl

      - name: Extend the historical replay ledger
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          FROZEN_ARG=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.frozen_inputs }}" = "true" ]; then
            FROZEN_ARG="--frozen-inputs"
          fi
          python scripts/run_replay.py replay-work/ledger \
            --pit-fundamentals replay-work/ledger/fundamentals/pit-kr.jsonl \
            ${{ (inputs.full && '--full') || '' }} \
            $FROZEN_ARG

      # A benchmark snapshot is observed vendor data that already passed the
      # plausibility check. If the run then fails for another reason — the other
      # region's vendor was down, the coverage gate tripped — discarding it means
      # tomorrow starts from nothing again. Persist it, and only it.
      - name: Preserve benchmark snapshots and input conflicts from a failed run
        if: failure()
        run: |
          python -c 'from pipeline.historical_store import assert_pushable; assert_pushable("replay-work/ledger")'
          cd replay-work
          if [ -d ledger/benchmarks ]; then git add ledger/benchmarks; fi
          if [ -d ledger/replay-input-conflicts ]; then git add ledger/replay-input-conflicts; fi
          if git diff --cached --quiet; then
            echo "benchmark snapshots unchanged"
            exit 0
          fi
          git commit -m "replay: preserve benchmark snapshots from a failed run"
          for attempt in 1 2 3 4 5; do
            if git push origin signal-history; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the remote"
            git fetch origin signal-history
            if ! git rebase origin/signal-history; then
              git rebase --abort || true
              echo "could not rebase onto signal-history"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "could not push after 5 attempts"
          exit 1

      - name: Audit maturity-safe probability calibration
        run: |
          python scripts/audit_probability.py replay-work/ledger

      # Deliberately NOT fatal here. A blocked report — a failed benchmark
      # gate, or the determinism guard finding the published past changed — is
      # the most important artifact the run produces, and it lives in the
      # ledger that gets pushed 30 lines below. Exiting here would kill the job
      # before that push, discard the whole day's replay, and leave the
      # divergence unrecorded and unreadable: the guard would erase the
      # evidence it exists to surface, then re-run tomorrow and do it again.
      # So: record first, fail after the push.
      - name: Audit alpha ranking and concentrated portfolios
        id: portfolio_audit
        continue-on-error: true
        run: |
          set +e
          python scripts/audit_portfolio.py replay-work/ledger
          code=$?
          set -e
          # `outcome` only says failed/not. The exit code says WHICH failure,
          # and the two mean opposite things: 1 is a completed audit whose
          # contract failed, anything else is an audit that never wrote a
          # report at all.
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      # Weekly (Sunday) or on demand. Selection is walk-forward and the sealed
      # holdout is scored once, so more frequent retraining buys nothing and
      # would multiply the effective number of trials.
      - name: Train / validate the opportunity model
        run: |
          if { [ "${{ github.event_name }}" != "schedule" ] && [ "$(date -u +%u)" = "7" ] && [ "${{ inputs.frozen_inputs }}" != "true" ]; } || [ "${{ inputs.retrain }}" = "true" ]; then
            python scripts/train_opportunity.py replay-work/ledger
            python scripts/train_opportunity.py replay-work/ledger --warning
          else
            echo "not a retrain day; keeping the existing model spec"
          fi

      # The ledger is sharded and gzipped precisely so it fits under GitHub's
      # 100 MB blob limit; check before committing so a regression in the shard
      # key is reported here rather than as a pre-receive rejection after the
      # expensive half of the job has already run.
      - name: Check ledger fits the remote
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from pipeline import historical_store as HS
          for row in HS.audit("replay-work/ledger")[:10]:
              print(f"  {row['bytes'] / 1024 / 1024:8.2f} MB  {row['path']}")
          HS.assert_pushable("replay-work/ledger")
          print("ledger is within the pushable size limit")
          PY

      - name: Commit & push to signal-history
        run: |
          cd replay-work
          git add ledger
          if git diff --cached --quiet; then
            echo "no historical ledger changes"
            exit 0
          fi
          git commit -m "replay: extend historical OOS ledger for $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            if git push origin signal-history; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the remote"
            git fetch origin signal-history
            if ! git rebase origin/signal-history; then
              git rebase --abort || true
              echo "could not rebase onto signal-history"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "could not push after 5 attempts"
          exit 1

      # The job still goes red — after the divergent report is safely in the
      # ledger. Downstream publication is already blocked by
      # contractValidation, which pipeline/validate.py and app.js both honour.
      #
      # But only a COMPLETED audit produces a verdict worth quoting. When the
      # audit itself dies, the report file is the previous run's, and naming
      # its failures here reports an old generation's evidence as this run's
      # reason — which is exactly what hid a KeyError behind a replay-v9
      # `continuous_nav_has_unknown_intervals` on the first replay-v10 run. So
      # check which generation the report on disk actually belongs to, and say
      # so.
      - name: Fail the run if the portfolio audit did not pass
        if: steps.portfolio_audit.outcome == 'failure'
        run: |
          python - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, ".")
          from pipeline import provenance
          report = pathlib.Path(
              "replay-work/ledger/historical-portfolio-validation.json")
          on_disk = None
          if report.exists():
              try:
                  on_disk = json.loads(report.read_text()).get("replayVersion")
              except ValueError:
                  on_disk = "UNREADABLE"
          print(f"current generation      : {provenance.REPLAY_VERSION}")
          print(f"report on signal-history: {on_disk}")
          if on_disk != provenance.REPLAY_VERSION:
              print("::warning::the validation report in the ledger is NOT from "
                    "this generation; it is stale evidence, not this run's verdict")
          PY
          if [ "${{ steps.portfolio_audit.outputs.exit_code }}" = "1" ]; then
            echo "::error::the portfolio audit blocked the report — see the" \
                 "'Audit alpha ranking and concentrated portfolios' step." \
                 "The blocked report has been pushed to signal-history so the" \
                 "failure can be read: check replayDeterminism.verdict and" \
                 "contractValidation.failures in" \
                 "ledger/historical-portfolio-validation.json"
          else
            echo "::error::the portfolio audit itself failed (exit" \
                 "${{ steps.portfolio_audit.outputs.exit_code }}) and wrote no" \
                 "report for this generation. Read the traceback in the" \
                 "'Audit alpha ranking and concentrated portfolios' step — NOT" \
                 "ledger/historical-portfolio-validation.json, which is an" \
                 "earlier run's verdict and says nothing about this one."
          fi
          exit 1

      - name: Summary
        run: |
          python - <<'PY'
          import json, pathlib
          path = pathlib.Path("replay-work/ledger/historical-diagnostics.json")
          if not path.exists():
              print("no diagnostics written"); raise SystemExit(0)
          d = json.loads(path.read_text())
          coverage = d.get("coverage") or {}
          print(f"replay {d.get('firstDate')} .. {d.get('lastDate')} "
                f"({d.get('replayDates')} dates, {d.get('frequency')})")
          print(f"signals {coverage.get('signalsRecorded')} / matured 126D "
                f"{(coverage.get('maturedByHorizon') or {}).get('126')}")
          print(f"PIT coverage {d.get('meanPitCoverage')} | survivorship "
                f"{d.get('survivorshipRisk')} | fundamentals PIT {d.get('fundamentalsPit')}")
          panel = d.get("benchmarkPanel") or {}
          for region, row in sorted((panel.get("byRegion") or {}).items()):
              print(f"benchmark source {region} {row.get('ticker')}: {row.get('status')} "
                    f"via {row.get('source')} ({row.get('sessions')} sessions "
                    f"through {row.get('lastSession')})")
          if panel.get("degradedRegions"):
              print(f"DEGRADED (snapshot fallback): {panel['degradedRegions']}")
          for row in d.get("benchmarkCoverageRegressions") or []:
              print(f"COVERAGE REGRESSION {row['region']}: {row['previousCoveragePct']}% "
                    f"({row['previousDate']}) -> {row['coveragePct']}%")
          gate = d.get("benchmarkCoverageGate") or {}
          for region in gate.get("assessedRegions") or []:
              row = (((coverage.get("benchmarkCoverageByRegion") or {}).get(region) or {})
                     .get(str(gate.get("horizon"))) or {})
              print(f"benchmark {region} {gate.get('horizon')}D "
                    f"{row.get('coveragePct')}% "
                    f"({row.get('matchedBenchmarkReturns')}/"
                    f"{row.get('maturedAbsoluteReturns')})")
          PY
