name: Historical point-in-time replay

# Builds and extends the HISTORICAL_OOS evidence base on the same dedicated
# `signal-history` branch the prospective paper ledger lives on — in SEPARATE
# files, so the two evidence classes can never be confused for one another.
#
# Cost control: the replay is incremental. Only dates absent from the ledger are
# computed, so the expensive full decade runs once (or when the replay logic
# changes) and daily runs append a handful of new grid dates. The ML model is
# retrained weekly rather than daily because a week of new observations cannot
# move a walk-forward selection, and refitting is the expensive half.

on:
  schedule:
    # 02:40 UTC daily, well after the 00:10 UTC ledger job has settled.
    - cron: "40 2 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Recompute every replay date (needed when replay logic changes)"
        type: boolean
        default: false
      retrain:
        description: "Force the opportunity/warning model retrain"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: signal-history-and-pages
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check out signal-history branch (orphan-safe)
        run: |
          git config user.name "historical-replay-bot"
          git config user.email "actions@github.com"
          if git ls-remote --exit-code --heads origin signal-history; then
            git fetch origin signal-history
            git worktree add replay-work origin/signal-history
            git -C replay-work checkout -B signal-history
          else
            git worktree add --detach replay-work
            git -C replay-work checkout --orphan signal-history
            git -C replay-work rm -rf . || true
          fi
          mkdir -p replay-work/ledger

      # Refresh index membership before the replay. The committed file is
      # US-only, built from the constituent repo's git history; this rebuild
      # also picks up the Korean half, which needs FinanceDataReader's delisting
      # list and therefore network. Best effort: on failure the replay falls
      # back to the committed file, and `constituentCoveragePct` reports the
      # smaller coverage rather than pretending the gap is not there.
      - name: Refresh point-in-time index membership
        run: |
          python scripts/build_universe_history.py data/universe-history.json \
            || echo "membership rebuild failed; using the committed file"
          python - <<'PY'
          import json, pathlib
          rows = json.loads(pathlib.Path("data/universe-history.json").read_text())
          by_region = {}
          for row in rows.values():
              key = row.get("region")
              by_region[key] = by_region.get(key, 0) + 1
          departed = sum(1 for r in rows.values() if r.get("delisted"))
          print(f"membership: {len(rows)} names {by_region}; {departed} no longer members")
          PY

      # A cached price panel keeps the incremental run cheap; a cache miss just
      # refetches, it never changes the result.
      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: .cache/prices
          key: replay-prices-${{ github.run_id }}
          restore-keys: replay-prices-

      - name: Extend the historical replay ledger
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          python scripts/run_replay.py replay-work/ledger \
            ${{ (inputs.full && '--full') || '' }}

      # A benchmark snapshot is observed vendor data that already passed the
      # plausibility check. If the run then fails for another reason — the other
      # region's vendor was down, the coverage gate tripped — discarding it means
      # tomorrow starts from nothing again. Persist it, and only it.
      - name: Preserve benchmark snapshots from a failed run
        if: failure()
        run: |
          cd replay-work
          if [ ! -d ledger/benchmarks ]; then
            echo "no benchmark snapshot to preserve"; exit 0
          fi
          git add ledger/benchmarks
          if git diff --cached --quiet; then
            echo "benchmark snapshots unchanged"
          else
            git commit -m "replay: preserve benchmark snapshots from a failed run"
            git push origin signal-history
          fi

      - name: Audit maturity-safe probability calibration
        run: |
          python scripts/audit_probability.py replay-work/ledger

      - name: Audit alpha ranking and concentrated portfolios
        run: |
          python scripts/audit_portfolio.py replay-work/ledger

      # Weekly (Sunday) or on demand. Selection is walk-forward and the sealed
      # holdout is scored once, so more frequent retraining buys nothing and
      # would multiply the effective number of trials.
      - name: Train / validate the opportunity model
        run: |
          if [ "$(date -u +%u)" = "7" ] || [ "${{ inputs.retrain }}" = "true" ]; then
            python scripts/train_opportunity.py replay-work/ledger
            python scripts/train_opportunity.py replay-work/ledger --warning
          else
            echo "not a retrain day; keeping the existing model spec"
          fi

      # The ledger is sharded and gzipped precisely so it fits under GitHub's
      # 100 MB blob limit; check before committing so a regression in the shard
      # key is reported here rather than as a pre-receive rejection after the
      # expensive half of the job has already run.
      - name: Check ledger fits the remote
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from pipeline import historical_store as HS
          for row in HS.audit("replay-work/ledger")[:10]:
              print(f"  {row['bytes'] / 1024 / 1024:8.2f} MB  {row['path']}")
          HS.assert_pushable("replay-work/ledger")
          print("ledger is within the pushable size limit")
          PY

      - name: Commit & push to signal-history
        run: |
          cd replay-work
          git add ledger
          if git diff --cached --quiet; then
            echo "no historical ledger changes"
          else
            git commit -m "replay: extend historical OOS ledger for $(date -u +%Y-%m-%d)"
            git push origin signal-history
          fi

      - name: Summary
        run: |
          python - <<'PY'
          import json, pathlib
          path = pathlib.Path("replay-work/ledger/historical-diagnostics.json")
          if not path.exists():
              print("no diagnostics written"); raise SystemExit(0)
          d = json.loads(path.read_text())
          coverage = d.get("coverage") or {}
          print(f"replay {d.get('firstDate')} .. {d.get('lastDate')} "
                f"({d.get('replayDates')} dates, {d.get('frequency')})")
          print(f"signals {coverage.get('signalsRecorded')} / matured 126D "
                f"{(coverage.get('maturedByHorizon') or {}).get('126')}")
          print(f"PIT coverage {d.get('meanPitCoverage')} | survivorship "
                f"{d.get('survivorshipRisk')} | fundamentals PIT {d.get('fundamentalsPit')}")
          panel = d.get("benchmarkPanel") or {}
          for region, row in sorted((panel.get("byRegion") or {}).items()):
              print(f"benchmark source {region} {row.get('ticker')}: {row.get('status')} "
                    f"via {row.get('source')} ({row.get('sessions')} sessions "
                    f"through {row.get('lastSession')})")
          if panel.get("degradedRegions"):
              print(f"DEGRADED (snapshot fallback): {panel['degradedRegions']}")
          for row in d.get("benchmarkCoverageRegressions") or []:
              print(f"COVERAGE REGRESSION {row['region']}: {row['previousCoveragePct']}% "
                    f"({row['previousDate']}) -> {row['coveragePct']}%")
          gate = d.get("benchmarkCoverageGate") or {}
          for region in gate.get("assessedRegions") or []:
              row = (((coverage.get("benchmarkCoverageByRegion") or {}).get(region) or {})
                     .get(str(gate.get("horizon"))) or {})
              print(f"benchmark {region} {gate.get('horizon')}D "
                    f"{row.get('coveragePct')}% "
                    f"({row.get('matchedBenchmarkReturns')}/"
                    f"{row.get('maturedAbsoluteReturns')})")
          PY
