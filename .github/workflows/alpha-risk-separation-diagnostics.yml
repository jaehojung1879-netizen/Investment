name: Alpha risk separation diagnostics

# Read-only research DIAGNOSTIC EXTENSION. Consumes the same pinned
# replay-v16 ledger the other research analyses do, and writes only job
# artifacts in the code checkout — never inside the sealed ledger.
#
# This does NOT re-score `alpha-risk-separation-v1`. It re-runs that study's
# frozen rungs by calling its own functions and REFUSES to publish unless all
# ten scored blocks reproduce byte-identically against the checked-in
# docs/results/alpha-risk-separation-report.json. What it adds is the set
# difference between the two rungs (which the frozen study never measured),
# an exploratory two-axis stack reported outside the ladder, and the
# observational region-cap / entry-state reads.
on:
  workflow_dispatch:
  push:
    branches: [research/alpha-risk-separation-diagnostics-v1]
    paths:
      - 'pipeline/alpha_risk_separation_diagnostics.py'
      - 'pipeline/alpha_risk_separation.py'
      - 'pipeline/alpha_reliability.py'
      - 'pipeline/signal_persistence.py'
      - 'pipeline/kelly_portfolio.py'
      - 'pipeline/benchmark_alpha.py'
      - 'pipeline/portfolio_validation.py'
      - 'pipeline/selection_value.py'
      - 'scripts/run_alpha_risk_separation_diagnostics_replay.py'
      - 'tests/test_alpha_risk_separation_diagnostics.py'
      - '.github/workflows/alpha-risk-separation-diagnostics.yml'
      - 'docs/results/alpha-risk-separation-*'

permissions:
  contents: read

concurrency:
  group: alpha-risk-separation-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alpha-risk-separation-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout research code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test the read-only guarantees and the set-difference pairing
        run: >-
          python -m pytest -q
          tests/test_alpha_risk_separation_diagnostics.py
          tests/test_alpha_risk_separation.py
          tests/test_alpha_reliability.py
          tests/test_signal_persistence.py
          tests/test_switch_hurdle.py
          tests/test_selection_value.py
          tests/test_portfolio_validation.py
          tests/test_kelly_portfolio.py

      - name: Check out pinned sealed inputs (read-only)
        uses: actions/checkout@v5
        with:
          ref: b71d8cb5ce21815980d28b606852f9294d43cc53
          path: replay-work
          persist-credentials: false

      - name: Run the diagnostic extension
        run: |
          set -o pipefail
          python -u scripts/run_alpha_risk_separation_diagnostics_replay.py replay-work/ledger \
            --output alpha-risk-separation-diagnostics-report.json \
            --markdown alpha-risk-separation-diagnostics-report.md \
            | tee alpha-risk-separation-diagnostics.log

      - name: Verify the frozen study's own report was not touched
        run: git diff --exit-code -- docs/results/alpha-risk-separation-report.json
                                     docs/results/alpha-risk-separation-report.md

      - name: Verify sealed checkout unchanged
        run: test -z "$(git -C replay-work status --porcelain)"

      - name: Verify checked-in deterministic result when present
        run: |
          if test -f docs/results/alpha-risk-separation-diagnostics-report.json; then
            cmp alpha-risk-separation-diagnostics-report.json \
                docs/results/alpha-risk-separation-diagnostics-report.json
            cmp alpha-risk-separation-diagnostics-report.md \
                docs/results/alpha-risk-separation-diagnostics-report.md
          fi

      - name: Upload analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-risk-separation-diagnostics-v1
          path: |
            alpha-risk-separation-diagnostics-report.json
            alpha-risk-separation-diagnostics-report.md
            alpha-risk-separation-diagnostics.log
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          if test -f alpha-risk-separation-diagnostics-report.md; then
            cat alpha-risk-separation-diagnostics-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            tail -n 100 alpha-risk-separation-diagnostics.log >> "$GITHUB_STEP_SUMMARY"
          fi
