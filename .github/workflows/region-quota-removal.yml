name: Region quota removal

# Read-only research CHALLENGER. Consumes the same pinned replay-v16 ledger
# the other research analyses do, and writes only job artifacts in the code
# checkout — never inside the sealed ledger.
#
# `alpha-reliability-v1` measured that the diversification guard produces
# more turnover than the ranking's own opinion does: the region cap stopped
# a name on 93.10% of control rebalances, 134 of 145 times against one that
# outscored what the book took. This removes ONLY `maxNamesPerRegion` (opened
# to `targetNames`) and measures what the ranking wants when left alone,
# after first measuring whether the calibrated score is comparable across
# regions in practice.
on:
  workflow_dispatch:
  push:
    branches: [research/region-quota-removal-v1]
    paths:
      - 'pipeline/region_quota_removal.py'
      - 'pipeline/alpha_reliability.py'
      - 'pipeline/signal_persistence.py'
      - 'pipeline/switch_hurdle.py'
      - 'pipeline/benchmark_alpha.py'
      - 'pipeline/kelly_portfolio.py'
      - 'pipeline/portfolio_validation.py'
      - 'pipeline/selection_value.py'
      - 'scripts/run_region_quota_removal_replay.py'
      - 'tests/test_region_quota_removal.py'
      - '.github/workflows/region-quota-removal.yml'
      - 'docs/results/region-quota-removal-*'

permissions:
  contents: read

concurrency:
  group: region-quota-removal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  region-quota-removal:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout research code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test the config edit, the comparability read and region mix tallies
        run: >-
          python -m pytest -q
          tests/test_region_quota_removal.py
          tests/test_dynamic_breadth.py
          tests/test_alpha_risk_separation.py
          tests/test_alpha_reliability.py
          tests/test_signal_persistence.py
          tests/test_switch_hurdle.py
          tests/test_selection_value.py
          tests/test_portfolio_validation.py

      - name: Check out pinned sealed inputs (read-only)
        uses: actions/checkout@v5
        with:
          ref: b71d8cb5ce21815980d28b606852f9294d43cc53
          path: replay-work
          persist-credentials: false

      - name: Run the region-quota-removal ladder
        run: |
          set -o pipefail
          python -u scripts/run_region_quota_removal_replay.py replay-work/ledger \
            --output region-quota-removal-report.json \
            --markdown region-quota-removal-report.md \
            | tee region-quota-removal.log

      - name: Verify sealed checkout unchanged
        run: test -z "$(git -C replay-work status --porcelain)"

      - name: Verify checked-in deterministic result when present
        run: |
          if test -f docs/results/region-quota-removal-report.json; then
            cmp region-quota-removal-report.json docs/results/region-quota-removal-report.json
            cmp region-quota-removal-report.md docs/results/region-quota-removal-report.md
          fi

      - name: Upload analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: region-quota-removal-v1
          path: |
            region-quota-removal-report.json
            region-quota-removal-report.md
            region-quota-removal.log
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          if test -f region-quota-removal-report.md; then
            cat region-quota-removal-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            tail -n 100 region-quota-removal.log >> "$GITHUB_STEP_SUMMARY"
          fi
