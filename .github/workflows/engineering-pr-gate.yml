name: Investment Auto-merge eligibility trigger

# Trusted-main machine check. NEVER check out or execute PR contents.
# This workflow is inactive until its reviewed PR lands on protected main.
#
# Every trigger here runs the workflow file AND the script from the default
# branch. `pull_request`, `pull_request_review` and `pull_request_review_comment`
# are deliberately absent: for a same-repository PR those events run the
# workflow definition from the PR's merge ref, i.e. a definition the PR author
# controls, while still receiving this file's `checks: write` token.
# Reviews are not an eligibility input, so nothing is lost.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled, edited]
  workflow_run:
    workflows: [Tests]
    types: [completed]
  check_run:
    types: [completed]

permissions:
  actions: read          # bind the pytest check to the Tests workflow run
  checks: write          # post the eligibility check run, nothing else
  contents: read
  pull-requests: read

# One queue per PR for EVERY trigger. Grouping by event id let a slow
# evaluation that read an older state (label still present, audit still green)
# post its success after a newer evaluation had posted a failure.
concurrency:
  group: >-
    engineering-pr-gate-${{
      github.event.pull_request.number ||
      github.event.workflow_run.pull_requests[0].number ||
      github.event.check_run.pull_requests[0].number ||
      github.run_id }}
  cancel-in-progress: true

jobs:
  assess:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.base.ref == 'main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'check_run' &&
       github.event.check_run.name == 'Investment Independent AI Audit')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned by commit (v5.1.0). Only the gate script is materialized; the
      # job needs no dependency install, so no setup action runs either.
      - name: Check out trusted main, never the PR
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/engineering_pr_gate.py
          sparse-checkout-cone-mode: false
      - name: Fetch PR on exact SHA and post fail-closed machine check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/engineering_pr_gate.py
