name: Alpha opportunity model v4 execution (KR)

# Manual only. Never scheduled, never on push/PR. Runs the SEALED, MERGED
# alpha-opportunity-model-v4 KR-only preregistration's historical execution
# harness from reviewed, merged main and uploads research artifacts. It
# cannot edit the preregistration, cannot reseal it, and writes nothing to
# production, the site data, or signal-history.
#
# The freeze-only job proves every pre-label step (foundation-regression
# check, replay-manifest identity, execution-snapshot hash) runs clean BEFORE
# the execute job constructs a single label, and its frozen provenance is
# the one the execute job's own report must reproduce.

on:
  workflow_dispatch:
    inputs:
      sealed_sha256:
        description: Reviewed canonical v4 spec SHA-256 (must equal research_specs/alpha-opportunity-model-v4.sha256 on main)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: alpha-opportunity-model-v4-execution
  cancel-in-progress: false

jobs:
  freeze:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Verify the sealed preregistration is still exactly what was merged
        run: |
          python - <<'PY'
          import os
          from pipeline.alpha_opportunity_v4_spec import load_sealed
          load_sealed(expected_hash=os.environ['SEALED_SHA256'])
          print("preregistration seal verified unchanged")
          PY
        env:
          SEALED_SHA256: ${{ inputs.sealed_sha256 }}
      - name: Install pinned research dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Synthetic contract tests (execution harness + eligibility policy)
        run: |
          ruff check .
          python -m compileall -q pipeline scripts
          python -m pytest -q tests/test_alpha_opportunity_v4.py tests/test_alpha_opportunity_v4_execution.py
      - uses: actions/checkout@v5
        with:
          ref: signal-history
          path: research-inputs
          sparse-checkout: |
            ledger/replay-inputs
            ledger/historical/replay-v16/inputs.json
            ledger/fundamentals/kr
            ledger/universe/kr
          sparse-checkout-cone-mode: false
      - name: Freeze the execution snapshot (no label constructed yet)
        run: |
          python scripts/execute_alpha_opportunity_model_v4.py \
            --sealed-sha256 "$SEALED_SHA256" --input-root research-inputs --output "$RUNNER_TEMP/unused" \
            --freeze-only | tee "$RUNNER_TEMP/frozen-provenance.json"
        env:
          SEALED_SHA256: ${{ inputs.sealed_sha256 }}
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-opportunity-model-v4-frozen-provenance
          path: ${{ runner.temp }}/frozen-provenance.json
          if-no-files-found: error

  execute:
    needs: freeze
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - uses: actions/checkout@v5
        with:
          ref: signal-history
          path: research-inputs
          sparse-checkout: |
            ledger/replay-inputs
            ledger/historical/replay-v16/inputs.json
            ledger/fundamentals/kr
            ledger/universe/kr
          sparse-checkout-cone-mode: false
      - name: Execute the sealed v4 contract exactly once
        run: |
          python scripts/execute_alpha_opportunity_model_v4.py \
            --sealed-sha256 "$SEALED_SHA256" --input-root research-inputs \
            --output "$RUNNER_TEMP/alpha-opportunity-model-v4-results"
        env:
          SEALED_SHA256: ${{ inputs.sealed_sha256 }}
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-opportunity-model-v4-results
          path: ${{ runner.temp }}/alpha-opportunity-model-v4-results
          if-no-files-found: error
