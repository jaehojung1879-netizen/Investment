name: Alpha opportunity model v4 execution (KR)

# Manual only. Never scheduled, never on push/PR. Runs the SEALED, MERGED
# alpha-opportunity-model-v4 KR-only preregistration's historical execution
# harness from reviewed, merged main and uploads research artifacts. It
# cannot edit the preregistration, cannot reseal it, and writes nothing to
# production, the site data, or signal-history.
#
# Input snapshot: signal-history is NEVER checked out by branch name. The
# freeze job checks out the sealed commit alpha-opportunity-model-v3's own
# `futureExecutionInputs.signalHistoryCommit` names (the same commit v2's
# sealed `snapshots.signalHistoryCommit` names), verifies every raw file the
# harness reads against the sealed git-blob identity, and publishes the
# commit and the identity hash as job outputs. The execute job checks out
# THAT output commit and refuses to run unless the checkout and identity
# hash both equal what the freeze job recorded -- a moving branch cannot put
# the two jobs on different snapshots.
#
# `stop_before_labels` (default true) ends the run after the pre-label gates
# whatever they say; set it to false only after the gate result has been
# reviewed.

on:
  workflow_dispatch:
    inputs:
      sealed_sha256:
        description: Reviewed canonical v4 spec SHA-256 (must equal research_specs/alpha-opportunity-model-v4.sha256 on main)
        required: true
        type: string
      stop_before_labels:
        description: End after the pre-label gates (no forward label is constructed)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: alpha-opportunity-model-v4-execution
  cancel-in-progress: false

env:
  SEALED_SIGNAL_HISTORY_COMMIT: 4ea107ed0cde289f0a049a65ff13d2441a786710

jobs:
  freeze:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signal_history_sha: ${{ steps.frozen.outputs.signal_history_sha }}
      input_identity_sha256: ${{ steps.frozen.outputs.input_identity_sha256 }}
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Verify the sealed preregistration is still exactly what was merged
        run: |
          python - <<'PY'
          import os
          from pipeline.alpha_opportunity_v4_spec import load_sealed
          load_sealed(expected_hash=os.environ['SEALED_SHA256'])
          print("preregistration seal verified unchanged")
          PY
        env:
          SEALED_SHA256: ${{ inputs.sealed_sha256 }}
      - name: Install pinned research dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Synthetic contract tests (execution harness + eligibility policy)
        run: |
          ruff check .
          python -m compileall -q pipeline scripts
          python -m pytest -q tests/test_alpha_opportunity_v4.py tests/test_alpha_opportunity_v4_execution.py
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SEALED_SIGNAL_HISTORY_COMMIT }}
          path: research-inputs
          sparse-checkout: |
            ledger/replay-inputs
            ledger/historical/replay-v16/inputs.json
            ledger/fundamentals/kr
            ledger/universe/kr
          sparse-checkout-cone-mode: false
      - name: Freeze the input snapshot and foundation (reads no row, builds no label)
        id: frozen
        run: |
          python scripts/execute_alpha_opportunity_model_v4.py \
            --sealed-sha256 "$SEALED_SHA256" --input-root research-inputs \
            --expected-signal-history-sha "$SEALED_SIGNAL_HISTORY_COMMIT" \
            --freeze-only > "$RUNNER_TEMP/frozen-provenance.json"
          cat "$RUNNER_TEMP/frozen-provenance.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          record = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "frozen-provenance.json")))
          print("signal_history_sha=" + record["inputIdentity"]["signalHistoryCommit"])
          print("input_identity_sha256=" + record["inputIdentity"]["inputIdentitySha256"])
          PY
        env:
          SEALED_SHA256: ${{ inputs.sealed_sha256 }}
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-opportunity-model-v4-frozen-provenance
          path: ${{ runner.temp }}/frozen-provenance.json
          if-no-files-found: error

  execute:
    needs: freeze
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.freeze.outputs.signal_history_sha }}
          path: research-inputs
          sparse-checkout: |
            ledger/replay-inputs
            ledger/historical/replay-v16/inputs.json
            ledger/fundamentals/kr
            ledger/universe/kr
          sparse-checkout-cone-mode: false
      - name: Execute the sealed v4 contract on the frozen snapshot
        run: |
          STOP=""
          if [ "$STOP_BEFORE_LABELS" = "true" ]; then STOP="--stop-before-labels"; fi
          python scripts/execute_alpha_opportunity_model_v4.py \
            --sealed-sha256 "$SEALED_SHA256" --input-root research-inputs \
            --expected-signal-history-sha "$FROZEN_SHA" \
            --expected-input-identity-sha256 "$FROZEN_IDENTITY" \
            --output "$RUNNER_TEMP/alpha-opportunity-model-v4-results" $STOP
        env:
          SEALED_SHA256: ${{ inputs.sealed_sha256 }}
          STOP_BEFORE_LABELS: ${{ inputs.stop_before_labels }}
          FROZEN_SHA: ${{ needs.freeze.outputs.signal_history_sha }}
          FROZEN_IDENTITY: ${{ needs.freeze.outputs.input_identity_sha256 }}
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-opportunity-model-v4-results
          path: ${{ runner.temp }}/alpha-opportunity-model-v4-results
          if-no-files-found: error
