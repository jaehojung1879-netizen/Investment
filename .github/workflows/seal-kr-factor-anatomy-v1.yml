name: Seal KR factor anatomy v1 result
# TEMPORARY. Manual dispatch from merged main only. Downloads the exact formal result artifact INSIDE Actions, verifies its
# archive SHA-256 before anything is extracted, then commits the exact bytes to a dedicated branch and opens ONE Draft PR.
# It recomputes no statistic, never merges, and is deleted on the result-seal branch so no reusable sealing path remains.
#
# ALSO THE HOST OF THE rp1-c1 US EXPOSURE ROUTE (rp1-c1-us-exposure-ladder-replication-v1, WP4d). Every workflow inventory layer and both census tests
# are byte-pinned by sealed Phase C specs, so a new workflow file cannot be added without breaking a seal; this spent, unpinned workflow carries the
# route behind `rp1_c1_action`. Its default `none` runs ONLY the original seal job, exactly as before; every rp1-c1 job is skipped. See
# pipeline/rp1_c1_us_execution.py and docs/research-program/rp1-c1-us-exposure-ladder-replication.md.
#   freeze-sources  main only: acquire, bounded exact hashes, dates-only readiness, ONE metadata-only Draft PR with the manifest + re-pinned spec
#   dry-run         reacquire + verify exact bounded input hashes, every pre-lock check, then the whole pipeline on INVENTED values; no lock, no US value
#   execute         the OWNER's one-shot on merged main with the committed authorization; failure after the lock consumes the study, never retry
# The pull_request trigger runs only the outcome-free source probe, only on this route's authoring branch; licensed bytes never leave the runner.
on:
  workflow_dispatch:
    inputs:
      rp1_c1_action:
        description: "none = the original KR factor anatomy seal job only. rp1-c1 US route: freeze-sources / dry-run / execute (execute = owner one-shot)"
        type: choice
        options: [none, freeze-sources, dry-run, execute]
        default: none
      rp1_c1_authorization_sha256:
        description: "execute only: SHA-256 of the committed owner authorization file; typed by the owner, never auto-filled"
        type: string
        default: ''
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'pipeline/rp1_c1_us_*.py'
      - 'scripts/acquire_rp1_c1_us_sources.py'
      - 'scripts/run_rp1_c1_us_wp4d.py'
      - '.github/workflows/seal-kr-factor-anatomy-v1.yml'
      - 'docs/research-program/sources/rp1-c1-us-source-freeze-*.json'
      - 'docs/research-program/specs/rp1-c1-us-exposure-ladder-replication-v1*'
permissions:
  contents: write
  pull-requests: write
  actions: read
concurrency:
  group: seal-kr-factor-anatomy-v1
  cancel-in-progress: false
jobs:
  seal:
    if: github.event_name == 'workflow_dispatch' && inputs.rp1_c1_action == 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_ID: '11207962601'
      ARCHIVE_SHA256: f8020bdac9878f523091881d129e3c414234012c17e1fd61e1e49b6d6538b80f
      SEAL_BRANCH: research/kr-factor-anatomy-v1-result-seal
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Guards (main only, frozen spec, nothing sealed yet, branch absent)
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "MAIN_ONLY"; exit 1; }
          git fetch origin main
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] && [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ] || { echo "HEAD_IS_NOT_CURRENT_MAIN"; exit 1; }
          python .github/seal/seal_kr_factor_anatomy_v1.py check-main --root .
          if git ls-remote --exit-code --heads origin "$SEAL_BRANCH" >/dev/null 2>&1; then echo "SEAL_BRANCH_EXISTS"; exit 1; fi
      - name: Artifact metadata must match exactly
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" -o artifact-metadata.json
          python .github/seal/seal_kr_factor_anatomy_v1.py check-metadata --metadata artifact-metadata.json
      - name: Download the exact archive and verify its SHA-256 before extracting anything
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" -o artifact.zip
          sha256sum artifact.zip
          [ "$(sha256sum artifact.zip | awk '{print $1}')" = "$ARCHIVE_SHA256" ] || { echo "ARCHIVE_SHA256_MISMATCH"; exit 1; }
      - name: Extract, verify manifest provenance, write exact bytes and provenance
        run: |
          set -euo pipefail
          python .github/seal/seal_kr_factor_anatomy_v1.py seal --archive artifact.zip --workdir "$RUNNER_TEMP/extracted" \
            --root . --sealed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Install the seal tests, remove the temporary sealing helpers, validate
        run: |
          set -euo pipefail
          cp .github/seal/test_kr_factor_anatomy_v1_result_seal.py.txt tests/test_kr_factor_anatomy_v1_result_seal.py
          git rm -rq .github/seal tests/test_seal_kr_factor_anatomy_v1_script.py
          rm -rf .github/seal
          ruff check .
          python -m pytest -q tests/test_kr_factor_anatomy_v1_result_seal.py tests/test_kr_factor_anatomy_v1.py tests/test_kr_model_overlay_portfolio_v1_sealed_result.py
      - name: Commit to the seal branch and open ONE Draft PR
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$SEAL_BRANCH"
          git add docs/results/kr-factor-anatomy-v1-result.json docs/results/kr-factor-anatomy-v1-report.md \
            docs/results/kr-factor-anatomy-v1-manifest.json docs/results/kr-factor-anatomy-v1-seal-provenance.json \
            tests/test_kr_factor_anatomy_v1_result_seal.py
          git commit -q -m "Research: seal KR factor anatomy v1 exploratory result (exact artifact bytes, no statistic recomputed)"
          git push origin "$SEAL_BRANCH"
          cat > pr-body.md <<'B'
          **RESULT SEAL ONLY — NO HISTORICAL STATISTIC RECOMPUTED**

          Exact bytes of the formal `kr-factor-anatomy-v1` result, committed by an Actions run that downloaded the artifact and verified its archive SHA-256 before extracting anything.

          - execution run: 36960496371 · execution SHA: cd82a5b7edb08f18ccdaa3f231415354aef9a41c
          - artifact: kr-factor-anatomy-v1-results-36960496371 (id 11207962601)
          - archive SHA-256: f8020bdac9878f523091881d129e3c414234012c17e1fd61e1e49b6d6538b80f
          - anatomy spec SHA: ceb97f481ae7261e89da4467fba03465f0c78cc3654cd799c26e5088ee3bc3d2
          - raw input identity: 233df37ed205cc6b48828121e711417ccf961301dc58aa252430b343db9666a7
          - scientific status: EXPLORATORY_DEVELOPMENT_ON_OUTCOME_EXPOSED_KR_HISTORY

          Files are `anatomy.json` -> `kr-factor-anatomy-v1-result.json`, `report.md`, `manifest.json` (renamed only) plus a new provenance record with per-file SHA-256s. Committing the result path makes the anatomy workflow refuse any further execute. No PASS/FAIL or promotion semantics. Draft; do not merge automatically.
          B
          sed -i 's/^          //' pr-body.md
          gh pr create --draft --base main --head "$SEAL_BRANCH" \
            --title "Research: seal KR factor anatomy v1 exploratory result" --body-file pr-body.md

  rp1-c1-source-probe:
    # Outcome-free rehearsal on live vendor bytes, ONLY on this route's authoring pull request. Acquires into the runner's temp directory (never the
    # repository), runs the dates-only readiness and the synthetic dry run, and keeps only dates, counts, hashes and gate outcomes. Nothing raw is
    # uploaded; the licensed bytes die with the runner. The job is red unless the readiness reads READY.
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository &&
      (github.head_ref == 'research/rp1-c1-wp4d-execution-readiness' || github.head_ref == 'research/rp1-c1-hash-refetch-v2')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Acquire into the runner temp directory (dates-and-counts audit only is printed)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/acquire_rp1_c1_us_sources.py --output "$RUNNER_TEMP/rp1-c1-probe" || echo "ACQUISITION_INCOMPLETE (the probe reports which source)"
      - name: Dates-only readiness on the live bytes, then the whole pipeline on invented values
        run: |
          set -euo pipefail
          python scripts/run_rp1_c1_us_wp4d.py probe --snapshot "$RUNNER_TEMP/rp1-c1-probe/analysis" --output probe/probe.json
          python scripts/run_rp1_c1_us_wp4d.py dry-run --snapshot "$RUNNER_TEMP/rp1-c1-probe/analysis" --output probe/dry-run
      - name: Secret-free freeze preview (metadata only), then a fresh acquisition must match
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/run_rp1_c1_us_wp4d.py freeze-preview --snapshot "$RUNNER_TEMP/rp1-c1-probe/analysis" \
            --run-id "$GITHUB_RUN_ID" --commit "$GITHUB_SHA" --output probe/freeze-preview.json
          python scripts/acquire_rp1_c1_us_sources.py --output "$RUNNER_TEMP/rp1-c1-refetch-check"
          python - <<'PY_CHECK'
          import json, os
          from pathlib import Path
          from pipeline import rp1_c1_us_refetch as R
          frozen = json.loads(Path('probe/freeze-preview.json').read_bytes())
          actual = R.fingerprints(Path(os.environ['RUNNER_TEMP']) / 'rp1-c1-refetch-check/analysis')
          if actual != frozen['analysisFiles']:
              raise SystemExit('REFETCH_ANALYSIS_HASH_MISMATCH')
          Path('probe/refetch.json').write_text(json.dumps({'status':'EXACT_BOUNDED_INPUT_MATCH','files':len(actual),'sourceArtifacts':0,'lockClaims':0,'outcomes':0}))
          print('EXACT_BOUNDED_INPUT_MATCH; no source artifact or execution lock')
          PY_CHECK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rp1-c1-us-source-probe-${{ github.run_id }}
          path: probe
          retention-days: 30
          if-no-files-found: ignore
      - name: The readiness must read READY
        run: python -c "import json,sys; d=json.load(open('probe/probe.json'))['readiness']; print(d['decision'], d['blockers']); sys.exit(d['decision'] != 'READY_FOR_RP1_C1_FORMAL_EXECUTION')"

  rp1-c1-freeze-sources:
    # This reviewed storage migration freezes automatically on its merge. All
    # other source freezes still require the explicit freeze-sources dispatch.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.rp1_c1_action == 'freeze-sources') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'research/rp1-c1-hash-refetch-v2')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SNAPSHOT_RAW: /tmp/rp1-c1-sources
      SNAPSHOT: /tmp/rp1-c1-sources/analysis
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Main only, at the main tip (no new Secret)
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "MAIN_ONLY"; exit 1; }
          git fetch -q origin main
          [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ] || { echo "HEAD_IS_NOT_CURRENT_MAIN"; exit 1; }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Acquire into runner temporary storage and construct bounded exact inputs
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/acquire_rp1_c1_us_sources.py --output "$SNAPSHOT_RAW"
      - name: Dates-only readiness must read READY
        run: python scripts/run_rp1_c1_us_wp4d.py freeze-check --snapshot "$SNAPSHOT" --output freeze/readiness.json
      - name: Hash-only manifest and re-pinned spec, ONE Draft PR; no source artifact
        run: |
          set -euo pipefail
          BRANCH="research/rp1-c1-us-source-freeze-${GITHUB_RUN_ID}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then echo "FREEZE_BRANCH_EXISTS"; exit 1; fi
          python scripts/run_rp1_c1_us_wp4d.py freeze-manifest --snapshot "$SNAPSHOT" --run-id "$GITHUB_RUN_ID" --commit "$GITHUB_SHA"
          python scripts/build_rp1_c1_us_exposure_spec.py
          python scripts/run_rp1_c1_us_exposure.py verify
          python scripts/run_rp1_c1_us_wp4d.py verify-snapshot --snapshot "$SNAPSHOT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$BRANCH"
          git add -A docs/research-program/sources docs/research-program/specs
          git commit -q -m "Data: rp1-c1 bounded input hash freeze ${GITHUB_RUN_ID} (metadata only)"
          git push origin "$BRANCH"
          printf '%s\n' "**BOUNDED INPUT HASH FREEZE — NO OUTCOME COMPUTED**" "" \
            "Freeze run ${GITHUB_RUN_ID} on main ${GITHUB_SHA}; manifest and spec pins only. No source artifact or new Secret." \
            "Raw response hashes are audit-only. Exact bounded analysis hashes, action context and normalization code are pinned." \
            "Re-fetch may become unavailable or drift; either refuses before the lock. Identical future access is not guaranteed." \
            "Owner reviews and merges this PR, then reviews the explicit authorization. No automatic merge or execute." > pr-body.md
          gh pr create --draft --base main --head "$BRANCH" --title "Data: rp1-c1 US bounded input hash freeze ${GITHUB_RUN_ID}" --body-file pr-body.md

  rp1-c1-dry-run:
    # A reviewed source-freeze merge checks re-fetch and synthetic evaluation automatically; never execute.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.rp1_c1_action == 'dry-run') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.head_ref, 'research/rp1-c1-us-source-freeze-'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SNAPSHOT_RAW: /tmp/rp1-c1-sources
      SNAPSHOT: /tmp/rp1-c1-sources/analysis  # transient only; no source artifact
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Reacquire with the existing FRED key, then verify exact bounded input hashes
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/acquire_rp1_c1_us_sources.py --output "$SNAPSHOT_RAW"
          python scripts/run_rp1_c1_us_wp4d.py verify-snapshot --snapshot "$SNAPSHOT"
      - name: Every pre-lock check, then the whole pipeline on invented values (no lock, no US value)
        run: |
          set -euo pipefail
          if [ -d "$SNAPSHOT" ]; then python scripts/run_rp1_c1_us_wp4d.py dry-run --snapshot "$SNAPSHOT" --output dry-run
          else python scripts/run_rp1_c1_us_wp4d.py dry-run --output dry-run; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rp1-c1-us-exposure-dry-run-${{ github.run_id }}
          path: dry-run
          retention-days: 30
          if-no-files-found: ignore

  rp1-c1-execute:
    # The ONE formal execution. Never on pull_request; only the owner's manual dispatch of merged main with the committed authorization.
    if: github.event_name == 'workflow_dispatch' && inputs.rp1_c1_action == 'execute'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: rp1-c1-us-exposure-ladder-replication-v1-single-attempt
      cancel-in-progress: false
    permissions:
      contents: write      # ONLY to create the one-shot lock tags (git refs); nothing is pushed by this job
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SNAPSHOT_RAW: /tmp/rp1-c1-sources
      SNAPSHOT: /tmp/rp1-c1-sources/analysis  # transient only; no source artifact
      AUTHORIZATION_SHA256: ${{ inputs.rp1_c1_authorization_sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Main only, first attempt, no earlier results artifact
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "MAIN_ONLY"; exit 1; }
          [ "$GITHUB_RUN_ATTEMPT" = "1" ] || { echo "FIRST_ATTEMPT_ONLY"; exit 1; }
          earlier="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("rp1-c1-us-exposure-results-")) | select(.expired | not) | .name')"
          [ -z "$earlier" ] || { echo "RESULTS_ARTIFACT_ALREADY_EXISTS: $earlier"; exit 1; }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify the owner's committed authorization BEFORE any re-acquisition (no lock)
        run: python scripts/run_rp1_c1_us_wp4d.py authorization-check --authorization-sha256 "$AUTHORIZATION_SHA256"
      - name: Reacquire using the existing FRED key; bounded inputs must match exactly
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/acquire_rp1_c1_us_sources.py --output "$SNAPSHOT_RAW"
          python scripts/run_rp1_c1_us_wp4d.py verify-snapshot --snapshot "$SNAPSHOT"
      - name: Formal execution (authorization and gates before the lock, lock before the marker, marker before any US value)
        id: execution
        run: python scripts/run_rp1_c1_us_wp4d.py execute --snapshot "$SNAPSHOT" --output run --authorization-sha256 "$AUTHORIZATION_SHA256"
      - name: Print the outputs for recovery without artifact storage (aggregate statistics only)
        if: always()
        run: |
          for f in run/result.json run/validation.json run/manifest.json run/execution-started.json run/report.md run/gates-blocked.json; do
            [ -f "$f" ] && python scripts/run_rp1_c1_us_wp4d.py encode-for-log --file "$f"; sha256sum "$f" 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v4
        if: always() && steps.execution.outcome == 'success'
        with:
          name: rp1-c1-us-exposure-results-${{ github.run_id }}
          path: run
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always() && steps.execution.outcome != 'success'
        with:
          name: rp1-c1-us-exposure-attempt-${{ github.run_id }}
          path: run
          retention-days: 90
          if-no-files-found: ignore
      - name: Report whether the study was consumed (no retry either way)
        if: always()
        run: |
          code=$(curl -s -o lock.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/rp1-c1-us-exposure-ladder-replication-v1-execution-lock")
          if [ "$code" = "200" ] && [ "$(python -c "import json; print(len(json.load(open('lock.json'))))")" != "0" ]; then
            echo "## STUDY LOCKED: the one execution has been spent. DO NOT RETRY." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Stopped before the lock: nothing was spent." >> "$GITHUB_STEP_SUMMARY"
          fi
