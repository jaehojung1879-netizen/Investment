name: Alpha calibration resolution

# Read-only research CHALLENGER. Consumes the same pinned replay-v16 ledger
# the other research analyses do, and writes only job artifacts in the code
# checkout — never inside the sealed ledger.
#
# One axis: among candidates the expanding-bucket calibration has already
# collapsed to ONE calibrated expected excess (same region, same
# calibrationBucket), does restoring the discarded alphaPercentile ordering
# WITHIN that group improve selection? The four-factor alpha, the
# calibration table and its bucket edges, the selection score's
# downside-volatility denominator, entry logic, region/sector caps,
# targetNames = 5, cash floor, inverse-vol sizing, transaction costs,
# benchmark construction and the rebalance schedule are held fixed and
# identical across both rungs.
on:
  workflow_dispatch:
  push:
    branches: [research/alpha-calibration-resolution-v1]
    paths:
      - 'pipeline/alpha_calibration_resolution.py'
      - 'pipeline/alpha_risk_separation_diagnostics.py'
      - 'pipeline/alpha_reliability.py'
      - 'pipeline/entry_selection_separation.py'
      - 'pipeline/signal_persistence.py'
      - 'pipeline/lowvol_alpha_separation.py'
      - 'pipeline/longterm.py'
      - 'pipeline/kelly_portfolio.py'
      - 'pipeline/benchmark_alpha.py'
      - 'pipeline/portfolio_validation.py'
      - 'pipeline/selection_value.py'
      - 'scripts/run_alpha_calibration_resolution_replay.py'
      - 'tests/test_alpha_calibration_resolution.py'
      - '.github/workflows/alpha-calibration-resolution.yml'
      - 'docs/results/alpha-calibration-resolution-*'

permissions:
  contents: read

concurrency:
  group: alpha-calibration-resolution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alpha-calibration-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout research code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test the ordinal rescue mechanism and its dependencies
        run: >-
          python -m pytest -q
          tests/test_alpha_calibration_resolution.py
          tests/test_alpha_risk_separation_diagnostics.py
          tests/test_alpha_risk_separation.py
          tests/test_lowvol_alpha_separation.py
          tests/test_entry_selection_separation.py
          tests/test_alpha_reliability.py
          tests/test_signal_persistence.py
          tests/test_alpha_variants.py
          tests/test_kelly_portfolio.py
          tests/test_portfolio_validation.py

      - name: Check out pinned sealed inputs (read-only)
        uses: actions/checkout@v5
        with:
          ref: b71d8cb5ce21815980d28b606852f9294d43cc53
          path: replay-work
          persist-credentials: false

      - name: Run the alpha-calibration-resolution ladder
        run: |
          set -o pipefail
          python -u scripts/run_alpha_calibration_resolution_replay.py replay-work/ledger \
            --output alpha-calibration-resolution-report.json \
            --markdown alpha-calibration-resolution-report.md \
            | tee alpha-calibration-resolution.log

      - name: Verify sealed checkout unchanged
        run: test -z "$(git -C replay-work status --porcelain)"

      - name: Verify checked-in deterministic result when present
        run: |
          if test -f docs/results/alpha-calibration-resolution-report.json; then
            cmp alpha-calibration-resolution-report.json \
                docs/results/alpha-calibration-resolution-report.json
            cmp alpha-calibration-resolution-report.md \
                docs/results/alpha-calibration-resolution-report.md
          fi

      - name: Upload analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-calibration-resolution-v1
          path: |
            alpha-calibration-resolution-report.json
            alpha-calibration-resolution-report.md
            alpha-calibration-resolution.log
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          if test -f alpha-calibration-resolution-report.md; then
            cat alpha-calibration-resolution-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            tail -n 100 alpha-calibration-resolution.log >> "$GITHUB_STEP_SUMMARY"
          fi
